<title>PostMan</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===================================================================
   PostMan - report engine for KISEM / IEA detailed energy assessments.
   Editor chrome is responsive; the report canvas is a fixed A4 artefact.
   =================================================================== */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f7f9fb;
  --ink:#16202b; --ink-2:#55636f; --ink-3:#8494a3;
  --line:#dbe2ea; --line-2:#eef2f6;
  --brand:#004aad; --brand-soft:#e6eefb; --on-brand:#ffffff;
  --ok:#0b8a45; --ok-soft:#e4f6ec;
  --warn:#b47500; --warn-soft:#fff4dd;
  --bad:#c00000; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(15,47,118,.07),0 8px 22px rgba(15,47,118,.06);
  --rule:var(--line);
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --panel:#151d26; --panel-2:#111820;
    --ink:#e6ecf3; --ink-2:#a7b6c5; --ink-3:#778695;
    --line:#26303c; --line-2:#1c242e;
    --brand:#5b9bff; --brand-soft:#152540; --on-brand:#0b1017;
    --ok:#3fc57e; --ok-soft:#0f2a1c;
    --warn:#f0b429; --warn-soft:#2c2208;
    --bad:#ff7a82; --bad-soft:#2e1214;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#151d26; --panel-2:#111820;
  --ink:#e6ecf3; --ink-2:#a7b6c5; --ink-3:#778695;
  --line:#26303c; --line-2:#1c242e;
  --brand:#5b9bff; --brand-soft:#152540; --on-brand:#0b1017;
  --ok:#3fc57e; --ok-soft:#0f2a1c;
  --warn:#f0b429; --warn-soft:#2c2208;
  --bad:#ff7a82; --bad-soft:#2e1214;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,select,input,textarea{font:inherit;color:inherit}

/* ---- top bar ---- */
#top{
  position:sticky;top:0;z-index:40;background:var(--panel);
  border-bottom:1px solid var(--line);padding:9px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--brand)}
.meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em}
#top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 12px;font-size:12.5px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---- 3-pane shell ---- */
#shell{display:grid;grid-template-columns:238px minmax(360px,1fr) minmax(380px,1fr);
  height:calc(100% - 51px)}
#nav{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel-2);padding:10px 0 60px}
#work{overflow-y:auto;padding:18px 20px 90px;border-right:1px solid var(--line)}
#stage{overflow:auto;padding:20px 12px 70px;background:var(--bg)}
body.hide-preview #shell{grid-template-columns:238px 1fr}
body.hide-preview #stage{display:none}
/* Verifying a bill means reading a bill. The report preview is not what you
   are looking at, so it steps aside and the scan gets the whole width. */
body.verify-mode #shell{grid-template-columns:238px 1fr}
body.verify-mode #stage{display:none}

#viewtabs{display:none;gap:5px}
.vtab{padding:5px 11px;font-size:12.5px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);cursor:pointer}
.vtab[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
@media (max-width:1180px){
  #shell{grid-template-columns:238px 1fr}
  #stage{display:none}
  body.show-preview #shell{grid-template-columns:238px 1fr}
  body.show-preview #work{display:none}
  body.show-preview #stage{display:block}
  #viewtabs{display:flex}
}
@media (max-width:820px){
  #shell{grid-template-columns:1fr}
  #nav{display:none;border-right:none}
  body.show-nav #nav{display:block}
  body.show-nav #work,body.show-nav #stage{display:none}
  body.show-preview #work{display:none}
}

/* ---- nav ---- */
.navgroup{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-3);padding:14px 14px 5px}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 14px;font-size:13px;border:0;background:none;cursor:pointer;color:var(--ink-2);
  border-left:2px solid transparent}
.navitem:hover{background:var(--line-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--brand-soft);color:var(--brand);
  border-left-color:var(--brand);font-weight:600}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:0 0 auto}
.navitem .dot.on{background:var(--ok)}
.navitem .dot.part{background:var(--warn)}
.navitem .tog{margin-left:auto;font-size:10px;color:var(--ink-3)}
.navitem.off{opacity:.45}

/* ---- work pane ---- */
h1.wt{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
p.wd{margin:0 0 18px;color:var(--ink-2);font-size:13px;max-width:64ch}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:14px 15px 17px;margin:0 0 15px;box-shadow:var(--shadow)}
legend{font-size:13.5px;font-weight:600;padding:0 6px}
.hint{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;max-width:64ch}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block}
.lab{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;font-size:13px;
  border:1px solid var(--line);border-radius:6px;background:var(--panel)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input[type=file]{padding:5px;font-size:11.5px}
input[type=range]{padding:0;border:0}
input[type=checkbox]{width:auto}
.span2{grid-column:1/-1}
.sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;
  border-radius:0 5px 5px 0;font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.callout.info{border-left-color:var(--brand);background:var(--brand-soft)}
.callout.good{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft);color:var(--ink)}

/* ---- bill verification: figures on the left, the bill itself on the
   right. They stack below 1100px, and the image pane keeps its own
   height so the page never grows taller than the screen. ---- */
.verifysplit{display:grid;gap:16px;grid-template-columns:minmax(320px,0.82fr) minmax(0,1.18fr);align-items:start}
@media (max-width:1100px){.verifysplit{grid-template-columns:minmax(0,1fr)}}

/* ---- data table editor ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
table.ed{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.ed th{background:var(--panel-2);text-align:left;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ed td{padding:0;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
table.ed td:last-child{border-right:0}
table.ed tr:last-child td{border-bottom:0}
table.ed input,table.ed select{border:0;border-radius:0;background:transparent;padding:6px 8px;
  font-size:12.5px;min-width:78px}
table.ed input:focus{background:var(--brand-soft);outline:0}
table.ed td.calc{padding:6px 8px;color:var(--ink-2);background:var(--panel-2);white-space:nowrap}
table.ed td.act{width:1%;padding:0 4px;text-align:center}
.rowdel{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:4px 6px}
.rowdel:hover{color:var(--bad)}
.tblbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}

/* ---- ledger ---- */
.rec{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;
  background:var(--panel);padding:12px 14px;margin:0 0 10px}
.rec.thermal{border-left-color:#b4700a}
.rec.water{border-left-color:#7a2e8e}
.rec h4{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center}
.pill{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.draft{color:var(--warn)}
.kpis{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin:12px 0 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel)}
.kpi .k{font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3);display:block;margin-bottom:3px}
.kpi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---- SLD builder ---- */
#sldcanvas{border:1px solid var(--line);border-radius:8px;background:var(--panel);
  overflow:auto;position:relative}
#sldcanvas svg{display:block;background:
  repeating-linear-gradient(0deg,transparent 0 19px,var(--line-2) 19px 20px),
  repeating-linear-gradient(90deg,transparent 0 19px,var(--line-2) 19px 20px)}
.sldnode{cursor:grab}
.sldnode.sel rect{stroke-width:2.2}

/* ---- report canvas ---- */
.report{color-scheme:light}
.pagewrap{background:#fff;overflow:hidden;margin:0 auto;
  box-shadow:0 1px 2px rgba(15,47,118,.12),0 12px 30px rgba(15,47,118,.13)}
.stack{display:flex;flex-direction:column;align-items:center;gap:18px}
.scaler{transform-origin:top left}
#measure{position:absolute;left:-99999px;top:0;visibility:hidden}

/* ---- print ---- */
@media print{
  @page{size:794px 1123px;margin:0}
  html,body{background:#fff;margin:0;padding:0;height:auto}
  #top,#nav,#work,#viewtabs,.noprint{display:none!important}
  #shell{display:block!important;height:auto}
  /* Chrome lays print out at PAGE width (794px), so editor breakpoints fire
     during printing. Force the report view whatever the tab state is. */
  #stage,body.show-preview #stage,body.show-nav #stage{display:block!important;
    padding:0!important;overflow:visible;background:#fff}
  .stack{display:block!important;gap:0!important;padding:0!important}
  .pagewrap{width:794px!important;height:1123px!important;box-shadow:none!important;
    margin:0!important;break-after:page;page-break-after:always}
  .pagewrap:last-child{break-after:auto;page-break-after:auto}
  .scaler{transform:none!important}
}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>

<div id="top">
  <button class="btn ghost sm" id="navtoggle" style="display:none">Sections</button>
  <span class="brand">Post<i>Man</i></span>
  <span class="meta" id="reportline"></span>
  <div id="viewtabs" role="tablist">
    <button class="vtab" role="tab" data-view="work" aria-selected="true">Edit</button>
    <button class="vtab" role="tab" data-view="preview" aria-selected="false">Report</button>
  </div>
  <div class="right">
    <label class="meta" style="display:flex;align-items:center;gap:5px">Zoom
      <select id="zoom" style="width:auto;padding:3px 6px;font-size:11.5px">
        <option value="0.4">40%</option><option value="0.55">55%</option>
        <option value="0.7" selected>70%</option><option value="0.85">85%</option>
        <option value="1">100%</option>
      </select>
    </label>
    <label class="meta" style="display:flex;align-items:center;gap:4px">
      <input type="checkbox" id="guides"> Guides
    </label>
    <button class="btn sm" id="demo">Load sample</button>
    <button class="btn sm" id="reset">Reset</button>
    <button class="btn primary sm" id="print">Print / PDF</button>
  </div>
</div>

<div id="shell">
  <nav id="nav" aria-label="Report sections"></nav>
  <div id="work"></div>
  <div id="stage" class="report"><div class="stack" id="stack"></div></div>
</div>
<div id="measure" class="report" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

/* ---- formatting. One formatter for the whole report, so a figure reads
   identically in the Certificate, the Executive Summary and the module
   that produced it. ---- */
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : null; }
function inr(n, d){
  if (n === null || n === undefined || !isFinite(n)) return '\u2014';
  d = d || 0;
  return Number(n).toLocaleString('en-IN', { minimumFractionDigits:d, maximumFractionDigits:d });
}
function rupees(n){
  if (n === null || n === undefined || !isFinite(n)) return '\u2014';
  if (Math.abs(n) >= 100000) return '\u20B9 ' + (n/100000).toFixed(2) + ' Lac';
  return '\u20B9 ' + inr(Math.round(n)) + '/-';
}
function fix(n, d){ return (n === null || n === undefined || !isFinite(n)) ? '\u2014' : Number(n).toFixed(d === undefined ? 2 : d); }
function pct(n, d){ return (n === null || !isFinite(n)) ? '\u2014' : Number(n).toFixed(d === undefined ? 1 : d) + ' %'; }
function months(n){
  if (n === null || !isFinite(n)) return '\u2014';
  if (n <= 0.05) return 'Immediate';
  return n.toFixed(1) + ' Months';
}
function pageNo(n){ return String(n).padStart(3,'0'); }
function reportNumber(fy, s){ return 'EAR/' + String(fy).replace(/^20/,'') + '_' + String(s).padStart(2,'0'); }
function longDate(iso){
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '\u2014';
  var day = d.getDate();
  var sfx = (day%10===1&&day!==11)?'st':(day%10===2&&day!==12)?'nd':(day%10===3&&day!==13)?'rd':'th';
  return day + sfx + ' ' + d.toLocaleString('en-GB',{month:'long'}) + ' ' + d.getFullYear();
}
function reportFilename(fy, s, co, iso){
  var d = new Date(iso + 'T00:00:00');
  var stamp = isNaN(d) ? '' :
    String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + d.getFullYear();
  return 'EAR_' + String(fy).replace(/^20/,'') + '_' + String(s).padStart(2,'0') +
    '_KISEM-IITGN_' + String(co||'Company').replace(/[\\/:*?"<>|]/g,'').trim() + '_' + stamp;
}
/* Financial year "2026-27" -> the twelve month labels it covers. */
function fyMonths(fy){
  var y = parseInt(String(fy).slice(0,4), 10);
  return MONTHS.map(function(m,i){ return m + ' ' + (i < 9 ? String(y).slice(2) : String(y+1).slice(2)); });
}

var S = blankState();
var KEY = 'postman.report.v2';

function loadState(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    S = deepMerge(blankState(), parsed);
  } catch (e) { /* private window or blocked storage - start clean */ }
}
function deepMerge(base, over){
  if (over === null || over === undefined) return base;
  if (Array.isArray(base) || Array.isArray(over)) return Array.isArray(over) ? over : base;
  if (typeof base !== 'object' || typeof over !== 'object') return over;
  var out = {}, k;
  for (k in base) out[k] = base[k];
  for (k in over) out[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];
  return out;
}
var saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { /* quota or blocked - the draft still lives in memory */ }
  }, 250);
}

/* ---- images. Alpha is preserved end to end; the stored asset is always
   PNG-32, never flattened, so one file works on the white cover and on a
   coloured header later. ---- */
function readFile(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(String(r.result)); };
    r.onerror = function(){ rej(new Error('Could not read that file.')); };
    r.readAsDataURL(file);
  });
}
function loadImg(src){
  return new Promise(function(res, rej){
    var i = new Image();
    i.onload = function(){ res(i); };
    i.onerror = function(){ rej(new Error('Could not read that image.')); };
    i.src = src;
  });
}
function ingestImage(file){
  return readFile(file).then(loadImg).then(function(img){
    var cv = document.createElement('canvas');
    /* Cap the stored edge at 1800px: a 12 MP phone photo would otherwise sit
       in local storage at full size and blow the quota after three uploads. */
    var scale = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    cv.width = Math.round(img.naturalWidth * scale);
    cv.height = Math.round(img.naturalHeight * scale);
    var cx = cv.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    var alpha = false;
    try {
      var d = cx.getImageData(0,0,cv.width,cv.height).data;
      for (var i = 3; i < d.length; i += 4){ if (d[i] < 250){ alpha = true; break; } }
    } catch (e) {}
    return { dataUrl: cv.toDataURL(alpha ? 'image/png' : 'image/jpeg', 0.86),
             w: img.naturalWidth, h: img.naturalHeight, alpha: alpha,
             lowRes: Math.max(img.naturalWidth, img.naturalHeight) < 600 };
  });
}
function knockoutWhite(asset, tol){
  return loadImg(asset.dataUrl).then(function(img){
    var cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    var cx = cv.getContext('2d');
    cx.drawImage(img, 0, 0);
    var im = cx.getImageData(0,0,cv.width,cv.height), d = im.data, lim = 255 - tol;
    for (var i = 0; i < d.length; i += 4){
      if (d[i] >= lim && d[i+1] >= lim && d[i+2] >= lim) d[i+3] = 0;
    }
    cx.putImageData(im, 0, 0);
    return { dataUrl: cv.toDataURL('image/png'), w: cv.width, h: cv.height,
             alpha:true, lowRes: asset.lowRes };
  });
}

/* ---- the Recommendation Ledger. One row per recommendation, owned by the
   module that produced it. The Certificate paragraph, the Executive Summary,
   the Savings Summary table and the Observations table are all templates over
   this list, so the same figure can never appear twice with two values. ---- */
function roiMonths(r){
  var inv = num(r.investment), sav = num(r.monetary);
  if (inv === null || inv <= 0) return 0;
  if (sav === null || sav <= 0) return null;
  return (inv / sav) * 12;
}
function pctSaving(r){
  var c = num(r.consumption), s = num(r.saving);
  if (!c || c <= 0 || s === null) return null;
  return (s / c) * 100;
}
function rollUp(rows){
  var t = { elecKwh:0, thermalQty:0, money:{electrical:0,thermal:0,water:0},
            moneyTotal:0, investment:0, co2:0, roi:null, draft:0, count:rows.length };
  rows.forEach(function(r){
    if (r.status !== 'verified') t.draft++;
    var s = num(r.saving) || 0;
    if (r.type === 'electrical') t.elecKwh += s;
    if (r.type === 'thermal') t.thermalQty += s;
    var m = num(r.monetary) || 0;
    t.money[r.type] = (t.money[r.type] || 0) + m;
    t.moneyTotal += m;
    t.investment += num(r.investment) || 0;
    t.co2 += num(r.co2) || 0;
  });
  t.roi = t.moneyTotal > 0 ? (t.investment / t.moneyTotal) * 12 : null;
  return t;
}
function uid(){ return 'r' + Math.random().toString(36).slice(2,9); }

/* ===================================================================
   UI FRAMEWORK - navigation, field widgets, table editor.

   Editing a value repaints the REPORT only, never the form. Rebuilding
   the form on every keystroke is what breaks a drag: the slider you are
   holding gets replaced mid-gesture. Forms rebuild on section change or
   on a structural edit (a row added, an image replaced) and at no other
   time.
   =================================================================== */

function labelled(labelText, node, hintText){
  var l = el('label');
  l.appendChild(el('span','', labelText)).className = 'lab';
  l.appendChild(node);
  if (hintText) l.appendChild(el('span','', hintText)).className = 'sub';
  return l;
}

/* obj/key binding. `structural` forces a full form rebuild after the edit. */
function bindInput(node, obj, key, opts){
  opts = opts || {};
  var ev = opts.event || 'input';
  node.addEventListener(ev, function(){
    var v = node.type === 'checkbox' ? node.checked : node.value;
    if (opts.number) v = (v === '' ? null : num(v));
    obj[key] = v;
    if (opts.onChange) opts.onChange();
    save();
    if (opts.structural) renderAll(); else drawPreview();
  });
  return node;
}
function fText(obj, key, label, ph, hint){
  var i = el('input'); i.type='text'; i.value = obj[key] == null ? '' : obj[key];
  if (ph) i.placeholder = ph;
  return labelled(label, bindInput(i, obj, key), hint);
}
function fArea(obj, key, label, ph, hint){
  var t = el('textarea'); t.value = obj[key] == null ? '' : obj[key];
  if (ph) t.placeholder = ph;
  return labelled(label, bindInput(t, obj, key), hint);
}
function fNum(obj, key, label, ph, hint){
  var i = el('input'); i.type='number'; i.step='any';
  i.value = obj[key] == null ? '' : obj[key];
  if (ph) i.placeholder = ph;
  return labelled(label, bindInput(i, obj, key, {number:true}), hint);
}
function fSelect(obj, key, label, options, hint){
  var s = el('select');
  options.forEach(function(o){
    var v = (typeof o === 'string') ? o : o.v, t = (typeof o === 'string') ? o : o.t;
    var op = el('option','', t); op.value = v; s.appendChild(op);
  });

/* ---- generic table editor ----
   cols: [{k:'key', t:'Header', type:'text'|'num'|'select'|'check', opts:[], w:'90px',
           calc:function(row,i){return string}}]  */
function tableEditor(rows, cols, opts){
  opts = opts || {};
  var wrap = el('div');
  var tw = el('div'); tw.className = 'tblwrap';
  var t = el('table'); t.className = 'ed';
  var thead = el('thead'), htr = el('tr');
  cols.forEach(function(c){ htr.appendChild(el('th', c.w ? 'width:'+c.w : '', c.t)); });
  if (!opts.fixed) htr.appendChild(el('th','width:1%',''));
  thead.appendChild(htr); t.appendChild(thead);

  var tb = el('tbody');
  rows.forEach(function(row, idx){
    var tr = el('tr');
    cols.forEach(function(c){
      var td = el('td');
      if (c.calc){
        td.className = 'calc';
        td.textContent = c.calc(row, idx);
      } else if (c.type === 'select'){
        var s = el('select');
        c.opts.forEach(function(o){ var op = el('option','', o); op.value = o; s.appendChild(op); });
        s.value = row[c.k] == null ? '' : row[c.k];
        s.addEventListener('change', function(){
          row[c.k] = s.value; save();
          if (opts.recalc) renderAll(); else drawPreview();
        });
        td.appendChild(s);
      } else if (c.type === 'check'){
        var cb = el('input'); cb.type='checkbox'; cb.checked = !!row[c.k];
        cb.style.margin = '6px 8px';
        cb.addEventListener('change', function(){ row[c.k] = cb.checked; save(); drawPreview(); });
        td.appendChild(cb);
      } else {
        var i = el('input');
        i.type = c.type === 'num' ? 'number' : 'text';
        if (c.type === 'num') i.step = 'any';
        i.value = row[c.k] == null ? '' : row[c.k];
        if (c.ph) i.placeholder = c.ph;
        i.addEventListener('input', function(){
          row[c.k] = c.type === 'num' ? (i.value === '' ? null : num(i.value)) : i.value;
          save();
          if (opts.recalc) recalcCells(t, rows, cols);
          drawPreview();
        });
        td.appendChild(i);
      }
      tr.appendChild(td);
    });
    if (!opts.fixed){
      var ad = el('td'); ad.className='act';
      var b = el('button','', '\u00D7'); b.className='rowdel'; b.type='button';
      b.title = 'Delete row';
      b.onclick = function(){ rows.splice(idx,1); save(); renderAll(); };
      ad.appendChild(b); tr.appendChild(ad);
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t); wrap.appendChild(tw);

  if (!opts.fixed){
    var bar = el('div'); bar.className = 'tblbar';
    var add = el('button','', opts.addLabel || '+ Add row'); add.className='btn sm'; add.type='button';
    add.onclick = function(){
      var blank = {};
      cols.forEach(function(c){ if (!c.calc) blank[c.k] = (c.type==='num'? null : (c.type==='check'? false : '')); });
      if (opts.onAdd) opts.onAdd(blank, rows.length);
      rows.push(blank); save(); renderAll();
    };
    bar.appendChild(add);
    if (opts.extraButtons) opts.extraButtons.forEach(function(b){ bar.appendChild(b); });
    if (rows.length) bar.appendChild(el('span','font-size:12px;color:var(--ink-3)', rows.length + ' rows'));
    wrap.appendChild(bar);
  }
  return wrap;
}
/* Recompute only the calculated cells, so typing never rebuilds the row. */
function recalcCells(table, rows, cols){
  var body = table.tBodies[0];
  for (var r = 0; r < body.rows.length; r++){
    var ci = 0;
    for (var c = 0; c < cols.length; c++){
      if (cols[c].calc) body.rows[r].cells[c].textContent = cols[c].calc(rows[r], r);
    }
  }
}

function btn(text, fn, cls){
  var b = el('button','', text); b.className = 'btn sm' + (cls ? ' ' + cls : ''); b.type='button';
  b.onclick = fn; return b;
}
function card(title, hint){
  var f = el('fieldset');
  f.appendChild(el('legend','', title));
  if (hint) f.appendChild(el('p','', hint)).className = 'hint';
  return f;
}
function gridOf(nodes, two){
  var g = el('div'); g.className = 'grid' + (two ? ' g2' : '');
  nodes.forEach(function(n){ if (n) g.appendChild(n); });
  return g;
}
function fillMonths(list, fy, key){
  var labels = fyMonths(fy);
  if (list.length === 12) { labels.forEach(function(l,i){ list[i].month = l; }); return; }
  list.length = 0;
  labels.forEach(function(l){ var o = { month:l }; o[key] = null; list.push(o); });
}

/* ---- navigation ---- */
function completion(sec){
  var d;
  switch (sec.id){
    case 'cover': return (S.company.name && S.company.addr1) ? 'on' : (S.company.name ? 'part' : '');
    case 'team': return S.team.plant.length ? 'on' : 'part';
    case 'ledger': return S.ledger.length ? (rollUp(S.ledger).draft ? 'part' : 'on') : '';
    case 'production': return S.production.intro ? 'on' : '';
    case 'baseline': return S.baseline.elec.some(function(r){ return num(r.kwh); }) ? 'on' : '';
    case 'water': return S.baseline.water.length ? 'on' : '';
    case 'bills': return S.bills.length ? 'on' : '';
    /* Amber until every bill has been looked at by a person. */
    case 'verify': return S.bills.length ? (billsProgress().left ? 'part' : 'on') : '';
    case 'custom': return S.custom && S.custom.length ? 'on' : '';
    case 'dist': return (S.dist.motors.length || S.dist.pcc.length) ? 'on' : '';
    case 'tr': return S.tr.capacity ? 'on' : '';
    case 'sld': return (S.sld.nodes.length || S.assets.sldImage) ? 'on' : '';
    case 'instruments': return 'on';
    /* Sections that need no input of their own - defaults or pure roll-ups. */
    case 'frontText': case 'certificate': case 'summary': case 'ghg': case 'imports': return 'on';
    case 'costs': return S.costs.unitRate ? 'on' : 'part';
    default:
      d = S[sec.id];
      if (Array.isArray(d)) return d.length ? 'on' : '';
      if (d && typeof d === 'object') return Object.keys(d).some(function(k){
        var v = d[k]; return Array.isArray(v) ? v.length : (v !== null && v !== '' && v !== undefined);
      }) ? 'on' : '';
      return '';
  }
}
function renderNav(){
  var nav = q('nav'); clear(nav);
  var group = null;
  SECTIONS.forEach(function(sec){
    if (sec.group !== group){ group = sec.group; nav.appendChild(el('div','', group)).className='navgroup'; }
    var on = sectionOn(sec);
    var b = el('button'); b.className = 'navitem' + (on ? '' : ' off'); b.type='button';
    if (S.active === sec.id) b.setAttribute('aria-current','true');
    var dot = el('span'); dot.className = 'dot ' + (on ? completion(sec) : '');
    b.appendChild(dot);
    b.appendChild(document.createTextNode(sec.title));
    if (sec.opt){
      var t = el('span','', on ? 'on' : 'off'); t.className='tog';
      b.appendChild(t);
    }
    b.onclick = function(){ S.active = sec.id; save(); renderAll(); };
    nav.appendChild(b);
  });
}

FORMS.bills = function(w){
  var c = card('Twelve months of bills',
    'These rows produce the baseline, the whole bill-analysis section and two of the report\u2019s recommendations. Arithmetic checks run on every row: a red cell means the bill does not add up, which is sometimes worth a line in the report.');
  var fillB = btn('Create 12 months from FY', function(){
    var labels = fyMonths(S.meta.financialYear);
    S.bills = labels.map(function(l){
      return { month:l, contract:null, actualMD:null, billingDemand:null, kwh:null, kvah:null,
               pf:null, energyCharge:null, demandCharge:null, fuelSurcharge:null, duty:null,
               other:null, rebate:null, net:null, todNight:null, todPeak:null };
    });
    save(); renderAll();
  });
  var chk = function(b){
    var parts = ['energyCharge','demandCharge','fuelSurcharge','duty','other'].reduce(function(a,k){ return a + (num(b[k])||0); }, 0)
      - (num(b.rebate)||0);
    var net = num(b.net);
    if (net === null || parts === 0) return '\u2014';
    var diff = Math.abs(parts - net);
    return diff <= 5 ? 'ok' : ('off by ' + inr(Math.round(diff)));
  };
  var pfCalc = function(b){
    var kwh = num(b.kwh), kvah = num(b.kvah);
    if (!kwh || !kvah) return '\u2014';
    return (kwh/kvah).toFixed(3);
  };
  c.appendChild(tableEditor(S.bills, [

    { k:'contract', t:'CD kVA', type:'num' },
    { k:'actualMD', t:'Actual MD', type:'num' },

function billDerived(){
  var b = S.bills.filter(function(r){ return num(r.kwh); });
  var n = b.length || 1;
  var avgKwh = b.reduce(function(a,r){ return a + (num(r.kwh)||0); },0) / n;
  var avgMD = b.reduce(function(a,r){ return a + (num(r.actualMD)||0); },0) / n;
  var pfs = b.map(function(r){
    var p = num(r.pf); if (p) return p;
    var kwh = num(r.kwh), kvah = num(r.kvah);
    return (kwh && kvah) ? kwh/kvah : null;
  }).filter(function(x){ return x !== null; });
  var avgPF = pfs.length ? pfs.reduce(function(a,c){ return a+c; },0)/pfs.length : null;
  var cd = b.length ? (num(b[b.length-1].contract) || num(b[0].contract)) : null;
  var loadFactor = (avgMD && avgPF) ? avgKwh / (avgMD * avgPF * 24 * 30) : null;
  var utilityFactor = (cd && avgPF) ? avgKwh / (cd * avgPF * 24 * 30) : null;
  var demandFactor = cd ? avgMD / cd : null;
  var totalNet = b.reduce(function(a,r){ return a + (num(r.net)||0); },0);
  var totalKwh = b.reduce(function(a,r){ return a + (num(r.kwh)||0); },0);
  var blended = totalKwh ? totalNet/totalKwh : null;
  var night = b.reduce(function(a,r){ return a + (num(r.todNight)||0); },0);
  var nightShare = totalKwh ? (night/totalKwh)*100 : null;
  var maxMD = b.reduce(function(a,r){ return Math.max(a, num(r.actualMD)||0); },0);
  return { rows:b, avgKwh:avgKwh, avgMD:avgMD, avgPF:avgPF, cd:cd, maxMD:maxMD,
           loadFactor:loadFactor, utilityFactor:utilityFactor, demandFactor:demandFactor,
           blended:blended, nightShare:nightShare, totalKwh:totalKwh, totalNet:totalNet };
}

/* Excess air from flue O2, and the dry-flue-gas loss - the two numbers the
   boiler and thermopack sections both turn on. */
function excessAir(o2){ var v = num(o2); return (v === null || v >= 21) ? null : (v / (21 - v)) * 100; }
function dryFlueLoss(o2, tf, ta, gcv){
  var ea = excessAir(o2), g = num(gcv), Tf = num(tf), Ta = num(ta);
  if (ea === null || !g || Tf === null || Ta === null) return null;
  /* m ~ theoretical air (11.6 kg/kg for typical liquid/solid fuel) scaled by excess air */
  var m = 11.6 * (1 + ea/100);
  return ((m * 0.23 * (Tf - Ta)) / g) * 100;
}

  var eff = (dfl === null) ? null : 100 - dfl - (num(obj.radiation) || 0);
  var k = el('div'); k.className='kpis';
  [['Excess air', ea === null ? '\u2014' : pct(ea)],

/* ---- Air compressor. The model mirrors A-CMP so its export drops straight in. ---- */
function toCFM(v, unit){
  var n = num(v); if (n === null) return null;
  switch (unit){
    case 'CFM': return n;
    case 'm3/min': return n * 35.3147;
    case 'l/s': return n * 0.06 * 35.3147;
    case 'CMH': return (n/60) * 35.3147;
    default: return n;
  }
}

function compressorCalc(k){
  var ratedCFM = toCFM(k.ratedCap, k.capUnit);
  var ratedKw = num(k.ratedKw);
  var designSEC = (ratedKw && ratedCFM) ? ratedKw / ratedCFM : null;
  var designAirGen = (ratedKw && ratedCFM) ? ratedCFM / ratedKw : null;
  var actualCFM = null;
  if (k.testType === 'FAD'){
    var a = num(k.suctionArea), v = num(k.avgVelocity);
    if (a !== null && v !== null) actualCFM = a * v * 2118.88;   /* m\u00B3/s -> CFM */
  } else {
    var p1 = num(k.pumpP1), p2 = num(k.pumpP2), t = num(k.pumpTime), vol = num(k.tankVol);
    if (p1 !== null && p2 !== null && t && vol)
      actualCFM = ((p2 - p1) * vol * 60 / (1.01325 * t)) * 35.3147;
  }
  var mkw = num(k.measuredKw);
  var actualSEC = (mkw && actualCFM) ? mkw / actualCFM : null;
  var actualAirGen = (mkw && actualCFM) ? actualCFM / mkw : null;
  var deviation = (designSEC && actualSEC) ? ((actualSEC - designSEC) / designSEC) * 100 : null;
  var lh = num(k.loadHrs), th = num(k.totalHrs);
  var loadPct = (lh !== null && th) ? (lh/th)*100 : null;
  var annualKwh = (mkw && num(k.hoursPerDay)) ? mkw * num(k.hoursPerDay) * (num(S.costs.days) || 350) : null;
  return { ratedCFM:ratedCFM, designSEC:designSEC, designAirGen:designAirGen,
           actualCFM:actualCFM, actualSEC:actualSEC, actualAirGen:actualAirGen,
           deviation:deviation, loadPct:loadPct, annualKwh:annualKwh };
}

  var l=num(r.lux), wt=num(r.watt), a=num(r.area), t=num(r.target);

/* ===================================================================
   SINGLE LINE DIAGRAM BUILDER

   Every sample report has a "Plant Single Line Diagram" heading and in
   every one the diagram is an image made somewhere else - the most
   redrawn artefact in the report and the one most likely to disagree
   with the tables beside it. This builds it FROM the hierarchy instead,
   and annotates each node with the same measured figures the tables use,
   so the diagram becomes a finding rather than a decoration.
   =================================================================== */

var SLD_TYPES = {
  grid:        { label:'Grid supply',  w:120, h:38, fill:'#E8EEF9', stroke:'#004AAD' },
  dg:          { label:'DG set',       w:110, h:38, fill:'#F5EFE3', stroke:'#B4700A' },
  solar:       { label:'Solar',        w:110, h:38, fill:'#F1E9F5', stroke:'#7A2E8E' },
  transformer: { label:'Transformer',  w:130, h:44, fill:'#FFFFFF', stroke:'#004AAD' },
  bus:         { label:'LT bus',       w:220, h:22, fill:'#0F2F76', stroke:'#0F2F76' },
  pcc:         { label:'PCC panel',    w:130, h:40, fill:'#FFFFFF', stroke:'#2E3A44' },
  mcc:         { label:'MCC panel',    w:120, h:38, fill:'#FFFFFF', stroke:'#5A6875' },
  capacitor:   { label:'APFC / capacitor', w:120, h:36, fill:'#FFFFFF', stroke:'#0B8A45' },
  load:        { label:'Load / motor', w:110, h:34, fill:'#F7F9FB', stroke:'#8494A3' },
  meter:       { label:'Metering point', w:100, h:30, fill:'#FFF8E1', stroke:'#B47500' }
};

function sldAdd(type, name, parentId){
  var n = { id:'n'+(S.sld.nextId++), type:type, name:name || SLD_TYPES[type].label,
            parent:parentId || null, kw:null, kva:null, pf:null, vthd:null, ithd:null,
            rating:'', recId:'', provisional:false, x:null, y:null };
  S.sld.nodes.push(n);
  return n;
}
function sldNode(id){
  for (var i=0;i<S.sld.nodes.length;i++) if (S.sld.nodes[i].id === id) return S.sld.nodes[i];
  return null;
}
/* Layered tree layout. Positions persist once dragged, but a panel added in
   JET-Eff still appears without anyone redrawing the diagram. */
function sldLayout(force){
  var depth = {}, children = {};
  S.sld.nodes.forEach(function(n){ children[n.id] = []; });
  S.sld.nodes.forEach(function(n){ if (n.parent && children[n.parent]) children[n.parent].push(n); });
  var roots = S.sld.nodes.filter(function(n){ return !n.parent; });
  var rowAt = {};
  function place(n, d){
    depth[n.id] = d;
    rowAt[d] = (rowAt[d] || 0);
    children[n.id].forEach(function(c){ place(c, d+1); });
  }
  roots.forEach(function(r){ place(r, 0); });
  var byDepth = {};
  S.sld.nodes.forEach(function(n){
    var d = depth[n.id] || 0;
    (byDepth[d] = byDepth[d] || []).push(n);
  });
  var maxW = 0;
  Object.keys(byDepth).forEach(function(d){
    var row = byDepth[d], y = 40 + d * 92, x = 30;
    row.forEach(function(n){
      var t = SLD_TYPES[n.type] || SLD_TYPES.load;
      if (force || n.x === null || n.y === null){ n.x = x; n.y = y; }
      x += t.w + 26;
    });
    maxW = Math.max(maxW, x);
  });
  return { width: Math.max(760, maxW + 20), height: 60 + (Object.keys(byDepth).length) * 92 };
}
function sldBuildFromHierarchy(){
  S.sld.nodes = []; S.sld.nextId = 1;
  var grid = sldAdd('grid', 'Grid supply', null);
  var tr = sldAdd('transformer', (S.tr.capacity ? S.tr.capacity + ' kVA ' : '') + 'Transformer', grid.id);
  tr.rating = S.tr.capacity ? S.tr.capacity + ' kVA' : '';
  tr.vthd = num(S.tr.vthd); tr.ithd = num(S.tr.ithd);
  var bus = sldAdd('bus', 'LT bus', tr.id);
  var pccByName = {};
  S.dist.pcc.forEach(function(p){
    var n = sldAdd('pcc', p.name || 'PCC', bus.id);
    n.kw = num(p.kw); n.kva = num(p.kva); n.pf = num(p.pf);
    n.vthd = num(p.vthd); n.ithd = num(p.ithd);
    pccByName[(p.name||'').toLowerCase()] = n.id;
  });
  if (S.dist.apfc.length) sldAdd('capacitor', 'APFC panel', bus.id);
  sldLayout(true);
  save();
}

function sldSvg(forReport, guides){
  var dim = sldLayout(false);
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + dim.width + ' ' + dim.height);
  svg.setAttribute('width', forReport ? px(LIVE.w) : dim.width);
  if (forReport) svg.setAttribute('height', (LIVE.w / dim.width) * dim.height * PT + 'px');
  else svg.setAttribute('height', dim.height);
  svg.style.display = 'block';

  function mk(tag, attrs){
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  /* edges first so boxes sit on top */
  S.sld.nodes.forEach(function(n){
    if (!n.parent) return;
    var p = sldNode(n.parent); if (!p) return;
    var pt = SLD_TYPES[p.type] || SLD_TYPES.load, nt = SLD_TYPES[n.type] || SLD_TYPES.load;
    var x1 = p.x + pt.w/2, y1 = p.y + pt.h, x2 = n.x + nt.w/2, y2 = n.y;
    var mid = (y1 + y2) / 2;
    var d = 'M' + x1 + ' ' + y1 + ' L' + x1 + ' ' + mid + ' L' + x2 + ' ' + mid + ' L' + x2 + ' ' + y2;
    svg.appendChild(mk('path', { d:d, fill:'none', stroke:'#5A6875', 'stroke-width':1.4,
      'stroke-dasharray': n.provisional ? '5 4' : '' }));
  });
  S.sld.nodes.forEach(function(n){
    var t = SLD_TYPES[n.type] || SLD_TYPES.load;
    var g = mk('g', { transform:'translate(' + n.x + ',' + n.y + ')' });
    g.setAttribute('class', 'sldnode');
    g.dataset.id = n.id;
    var over = (num(n.vthd) !== null && num(n.vthd) > 5) || (num(n.ithd) !== null && num(n.ithd) > 8);
    g.appendChild(mk('rect', { width:t.w, height:t.h, rx: n.type==='bus'?3:5,
      fill:t.fill, stroke: over ? C.bad : t.stroke,
      'stroke-width': over ? 2 : 1.3,
      'stroke-dasharray': n.provisional ? '5 3' : '' }));
    var label = mk('text', { x:t.w/2, y: n.type==='bus' ? 15 : 16, 'text-anchor':'middle',
      'font-family':'Archivo, Arial, sans-serif', 'font-size':10.5, 'font-weight':600,
      fill: n.type==='bus' ? '#fff' : C.charcoal });
    label.textContent = n.name.length > 24 ? n.name.slice(0,23) + '\u2026' : n.name;
    g.appendChild(label);
    if (n.type !== 'bus'){
      var bits = [];
      if (n.rating) bits.push(n.rating);
      if (num(n.kw) !== null) bits.push(fix(n.kw,1) + ' kW');
      if (num(n.pf) !== null) bits.push('PF ' + fix(n.pf,2));
      if (num(n.ithd) !== null) bits.push('ITHD ' + fix(n.ithd,1) + '%');
      if (bits.length){
        var sub = mk('text', { x:t.w/2, y:29, 'text-anchor':'middle',
          'font-family':'IBM Plex Mono, monospace', 'font-size':8,
          fill: over ? C.bad : C.ink3 });
        sub.textContent = bits.join(' \u00B7 ');
        g.appendChild(sub);
      }
    }
    svg.appendChild(g);
  });
  return { svg:svg, dim:dim };
}

function enableSldDrag(svg){
  var drag = null;
  svg.addEventListener('pointerdown', function(e){
    var g = e.target.closest ? e.target.closest('.sldnode') : null;
    if (!g) return;
    var n = sldNode(g.dataset.id); if (!n) return;
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var sx = vb.width / box.width, sy = vb.height / box.height;
    drag = { n:n, ox:(e.clientX - box.left) * sx - n.x, oy:(e.clientY - box.top) * sy - n.y, sx:sx, sy:sy, box:box, g:g };
    g.classList.add('sel');
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', function(e){
    if (!drag) return;
    var x = (e.clientX - drag.box.left) * drag.sx - drag.ox;
    var y = (e.clientY - drag.box.top) * drag.sy - drag.oy;
    drag.n.x = Math.max(4, Math.round(x)); drag.n.y = Math.max(4, Math.round(y));
    drag.g.setAttribute('transform','translate(' + drag.n.x + ',' + drag.n.y + ')');
  });
  svg.addEventListener('pointerup', function(){
    if (!drag) return;
    drag.g.classList.remove('sel');
    drag = null; save(); drawPreview();
  });
}

/* ===================================================================
   IMPORTS - JET-Eff and A-CMP workbooks.
   Both apps already export by natural key and merge newest-wins, so
   re-importing is always safe.
   =================================================================== */
function readWorkbook(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){
      try { res(XLSX.read(new Uint8Array(r.result), { type:'array' })); }
      catch (e){ rej(new Error('That file is not a readable workbook.')); }
    };
    r.onerror = function(){ rej(new Error('Could not read that file.')); };
    r.readAsArrayBuffer(file);
  });
}
function sheetRows(wb, name){
  var sh = wb.Sheets[name];
  return sh ? XLSX.utils.sheet_to_json(sh, { defval:'' }) : [];
}
function pick(row, names){
  for (var i=0;i<names.length;i++) if (row[names[i]] !== undefined && row[names[i]] !== '') return row[names[i]];
  return null;
}

function importJetEff(wb, skip){
  var log = [];
  skip = skip || {};
  var pcc = sheetRows(wb, 'PCC Panels'), mcc = sheetRows(wb, 'MCC Panels');
  if (pcc.length || mcc.length){
    S.dist.pcc = pcc.concat(mcc).map(function(r){
      return { name: pick(r,['PCC Name','MCC Name','Name']) || '',
        v: num(pick(r,['V1'])), i: num(pick(r,['I1'])),
        kw: num(pick(r,['Total Power (kW)'])), kvar: num(pick(r,['KVAr (Q)','KVAr (D)'])),
        kva: null, pf: num(pick(r,['Power Factor'])),
        vthd: num(pick(r,['Uthd1'])), ithd: num(pick(r,['Ithd1'])) };
    });
    log.push(S.dist.pcc.length + ' panels');
  }
  var clamp = sheetRows(wb, 'Motor Loads Clamp'), pq = sheetRows(wb, 'Motor Loads PQ');
  if (clamp.length || pq.length){
    S.dist.motors = clamp.concat(pq).map(function(r, i){
      return { sr:i+1, name: pick(r,['Machine Tag']) || '',
        rated: num(pick(r,['Rated kW'])), starter: pick(r,['Starter Type']) || 'DOL',
        freq: num(pick(r,['VFD Frequency'])), v: num(pick(r,['Voltage (V)','Voltage (Avg)'])),
        i: num(pick(r,['Current (A)','Current (Avg)'])),
        kw: num(pick(r,['Measured kW'])), kvar: num(pick(r,['KVAr'])),
        kva: num(pick(r,['KVA'])), pf: num(pick(r,['Power Factor'])) };
    });
    log.push(S.dist.motors.length + ' motors');
  }
  var apfc = skip['APFC'] ? [] : sheetRows(wb, 'APFC');
  if (apfc.length){
    S.dist.apfc = apfc.map(function(r){
      return { stage: pick(r,['Stage']) || '', rated: num(pick(r,['Rated Capacitor Value'])),
        v: num(pick(r,['Voltage'])), ir: num(pick(r,['I-R'])), iy: num(pick(r,['I-Y'])),
        ib: num(pick(r,['I-B'])), remark: pick(r,['Remark']) || '' };
    });
    log.push(S.dist.apfc.length + ' APFC stages');
  }
  var prof = wb.Sheets['Company Profile'];
  var pmap = {};
  if (prof){
    var prows = XLSX.utils.sheet_to_json(prof, { header:1 });
    prows.forEach(function(r){ if (r && r[0] !== undefined && r[0] !== '') pmap[String(r[0]).trim()] = r[1]; });
    var name = pmap['Company Name'] || pmap['companyName'];
    if (name && S.company.name && String(name).trim() !== S.company.name.trim())
      log.push('note: workbook says "' + name + '", report says "' + S.company.name + '" \u2014 not overwritten');
    else if (name && !S.company.name){ S.company.name = String(name); log.push('company name'); }
    /* Cost parameters are what turn kg/hr into rupees. Importing the jets
       without them is how the section used to come out empty. */
    var cf = ['insulationCost','pumpInvestmentCost','trapReplacementCost',
              'fuelCost','unitRate','evaporationRatio'], got = 0;
    cf.forEach(function(f){
      var v = num(pmap[f]);
      if (v !== null){ S.jetCost[f] = v; got++; }
    });
    if (got) log.push(got + ' jet cost parameters');
    /* The report's own rate fields follow, so the summary and the jet
       section cannot quote two different unit rates. */
    if (num(pmap.unitRate) !== null && S.costs.unitRate === null) S.costs.unitRate = num(pmap.unitRate);
    if (num(pmap.evaporationRatio) !== null && S.costs.evapRatio === null) S.costs.evapRatio = num(pmap.evaporationRatio);
    if (num(pmap.fuelCost) !== null && S.costs.fuelCost === null) S.costs.fuelCost = num(pmap.fuelCost);
  }

  var jets = sheetRows(wb, 'Jet Data');
  if (jets.length){
    S.jets = jets.map(parseJetRow).filter(function(j){ return j; })
                 .map(function(j){ return recalcJet(j, S.jetCost); });
    S.enabled.jets = true;
    log.push(S.jets.length + ' jets (all ' + JET_FIELDS.length + ' columns)');
    var passing = S.jets.filter(function(j){ return j.trapStatus === 'Trap Passing'; }).length;
    var weak = S.jets.filter(function(j){ return j.pumpEfficiency !== null && j.pumpEfficiency < 40; }).length;
    if (passing) log.push(passing + ' passing trap(s)');
    if (weak) log.push(weak + ' pump(s) below 40 %');
    var made = syncJetLedger();
    if (made) log.push(made + ' recommendation(s) written to the ledger');
  }
  return log;
}

/* The ledger is the single source of every figure the report quotes twice.
   Importing jets therefore has to write the jet recommendations INTO it,
   not leave them stranded in the module - otherwise the executive summary
   and the savings table silently omit the largest saving in the report.
   Rows the user has already edited by hand are left alone; the three
   generated rows are rewritten on every import so the money always matches
   the measurements it came from. */
function syncJetLedger(){
  var R = jetsRollUp();
  if (!R.n) return 0;
  var days = num(S.jetCost.days) || 350;
  var evap = num(S.jetCost.evaporationRatio) || 1;
  var insTonnes = 0, trapTonnes = 0, pumpKwh = 0, insInv = 0, pumpInv = 0, trapInv = 0;
  S.jets.forEach(function(j){
    insTonnes  += num(j.insAnnualFuelSaving) || 0;
    if (num(j.trapInvestment)) trapTonnes += num(j.trapAnnualFuelSaving) || 0;
    if (num(j.pumpInvestment)) pumpKwh    += num(j.pumpAnnualPowerSaving) || 0;
    insInv  += num(j.insInvestment) || 0;
    pumpInv += num(j.pumpInvestment) || 0;
    trapInv += num(j.trapInvestment) || 0;
  });
  var unins = S.jets.filter(function(j){ return j.insulation !== 'Insulated'; })
                    .map(function(j){ return j.jetNo; });
  /* Emission factors carry units, and getting them wrong is invisible: it
     produces a number that is merely large, not obviously absurd, in the one
     figure a client is most likely to quote. `fuelEF` is kgCO2e per ONE UNIT
     of the report's thermal fuel (2380 for a tonne of coal) and the rest of
     the app divides by 1000 to reach tCO2e, so jet savings - which are in
     tonnes - must be converted into that same unit first. Skipping this gave
     469,848 tCO2e for a plant saving Rs 33.7 Lac. */
  var gef = num(S.costs.gridEF) || 0.716;
  var unit = String(S.baseline.thermalUnit || 'tonne').toLowerCase();
  var perTonne = /^(kg|kilogram)/.test(unit) ? 1000 : (/^(t|tonne|ton|mt)/.test(unit) ? 1 : null);
  var efT = (num(S.costs.fuelEF) !== null && perTonne !== null)
    ? num(S.costs.fuelEF) * perTonne / 1000 : null;   /* tCO2e per tonne of fuel */

  var specs = [];
  if (R.ins > 0) specs.push({
    key:'jet-insulation', type:'thermal', priority:'high',
    observation: (unins.length ? unins.length + ' of ' + R.n + ' jet machines (' +
        unins.slice(0,8).join(', ') + (unins.length > 8 ? ' and others' : '') +
        ') are uninsulated or only half insulated. ' : '') +
      'Measured surface temperatures give a combined recoverable steam loss of ' + fix(R.steam,1) + ' kg/hr.',
    recommendation:'Provide standard LRB insulation on the bare and half-insulated jet bodies at \u20B9 ' +
      inr(num(S.jetCost.insulationCost)) + ' per Sq. Mtr.',
    unit:'tonne/yr', saving:Math.round(insTonnes), monetary:Math.round(R.ins), investment:Math.round(insInv),
    co2: efT ? Math.round(insTonnes * efT * 10) / 10 : 0
  });
  if (R.pump > 0) specs.push({
    key:'jet-pump', type:'electrical', priority:'high',
    observation: R.weak.length + ' circulation pump(s) \u2014 ' + R.weak.slice(0,8).join(', ') +
      (R.weak.length > 8 ? ' and others' : '') + ' \u2014 measured below 40 % efficiency against an average of ' +
      pct(R.avgEff) + ' across the ' + R.n + ' machines surveyed.',
    recommendation:'Replace the below-benchmark jet circulation pumps with correctly sized units achieving at least 40 % efficiency at duty point.',
    unit:'kWh/yr', saving:Math.round(pumpKwh), monetary:Math.round(R.pump), investment:Math.round(pumpInv),
    co2: Math.round(pumpKwh * gef / 1000 * 10) / 10
  });
  if (R.trap > 0) specs.push({
    key:'jet-trap', type:'thermal', priority:'high',
    observation: R.passing.length + ' steam trap(s) \u2014 ' + R.passing.slice(0,8).join(', ') +
      (R.passing.length > 8 ? ' and others' : '') + ' \u2014 were found passing live steam to drain.',
    recommendation:'Replace the passing steam traps at \u20B9 ' + inr(num(S.jetCost.trapReplacementCost)) +
      ' each and put a quarterly trap survey in place.',
    unit:'tonne/yr', saving:Math.round(trapTonnes), monetary:Math.round(R.trap), investment:Math.round(trapInv),
    co2: efT ? Math.round(trapTonnes * efT * 10) / 10 : 0
  });

  var n = 0;
  specs.forEach(function(sp){
    var row = null;
    for (var i = 0; i < S.ledger.length; i++)
      if (S.ledger[i].autoKey === sp.key){ row = S.ledger[i]; break; }
    if (row && row.locked) return;
    if (!row){ row = { id:uid(), autoKey:sp.key, module:'jets', status:'draft', actionBy:'Plant' };
               S.ledger.push(row); }
    row.module = 'jets'; row.type = sp.type; row.priority = sp.priority;
    row.observation = sp.observation; row.recommendation = sp.recommendation;
    row.unit = sp.unit; row.saving = sp.saving; row.monetary = sp.monetary;
    row.investment = sp.investment; row.co2 = sp.co2;
    row.consumption = row.consumption || null;
    n++;
  });
  /* Streams that no longer earn anything drop out rather than linger. */
  var live = {}; specs.forEach(function(sp){ live[sp.key] = 1; });
  S.ledger = S.ledger.filter(function(r){
    return !r.autoKey || !/^jet-/.test(r.autoKey) || live[r.autoKey] || r.locked;
  });
  /* Hand-written rows are never touched - but a hand-written jet row sitting
     beside three generated ones is exactly how a report ends up claiming the
     same saving twice, so it is said out loud rather than left to be found. */
  var manual = S.ledger.filter(function(r){ return r.module === 'jets' && !r.autoKey; }).length;
  if (manual && n) alert(manual + ' hand-written jet recommendation(s) were already in the ledger.\n\n' +
    'They have been left exactly as they are, but they now sit alongside ' + n +
    ' recommendation(s) generated from the imported measurements. Check the ledger for double ' +
    'counting before you export.');
  return n;
}

/* ===================================================================
   JET-Eff record model, mirrored exactly.

   JET_FIELDS is the column order JET-Eff's own exporter writes, so a
   workbook round-trips losslessly: every field the app measured arrives
   here under the same name. The previous importer took eleven of these
   and dropped the rest, which is why the jet section had
   nothing to print.
   =================================================================== */
var JET_FIELDS = [
  'id','jetNo','jetType','insulation','capacity','dia','length','surfaceArea','operation','jetTemp',
  'flow','velocity','pipePeriphery','pressure','rpm','pumpPower','hydraulicPower','shaftPower','pumpEfficiency',
  'ambientTemp','bodyTemps','avgBodyTemp','surfaceHeatLoss','totalSurfaceHeatLoss',
  'steamPressure','steamTemp','lhSteam','eqSteamLoss','insulationBodyTemp',
  'surfaceHeatLossAfter','totalSurfaceHeatLossAfter','eqSteamLossAfter','steamSaving',
  'trapType','trapTempIn','trapTempOut','trapStatus','concentricDrain','trapEqSteamLoss',
  'waterTempBefore','waterTempAfter','heatInlet','eqSteamUsed','steamTempIn','steamTempOut',
  'totalSteamUsed','jetExchangeEfficiency',
  'coolingWaterIn','coolingWaterOut','coolingWaterFlow','coolingEffect','eqSteamCooling','coolingOption',
  'runningHrPerDay','heatingTimePerDay',
  'insEqCoalSaving','insDailyFuelSaving','insAnnualFuelSaving','insInvestment','insMonitoringSaving','insRoiMonths',
  'pumpSuggestion','shaftPowerAt40','pumpSavingKw','pumpDailyPowerSaving','pumpAnnualPowerSaving',
  'pumpMonitoringSaving','pumpRoiMonths',
  'trapEqFuelLoss','trapDailyFuelSaving','trapAnnualFuelSaving','trapMonitoringSaving','trapRoiMonths',
  'observation','recordedBy','createdAt'
];
var JET_TEXT = { id:1, jetNo:1, jetType:1, insulation:1, operation:1, trapType:1, trapStatus:1,
                 concentricDrain:1, pumpSuggestion:1, observation:1, recordedBy:1, createdAt:1 };

function parseJetRow(r){
  var no = r.jetNo === undefined || r.jetNo === null ? '' : String(r.jetNo).trim();
  if (!no) return null;
  var j = {};
  JET_FIELDS.forEach(function(f){
    var v = r[f];
    if (f === 'bodyTemps'){
      j.bodyTemps = (v === undefined || v === null || v === '') ? [] :
        String(v).split('/').map(function(t){ return t.trim() === '' ? null : num(t); });
    } else if (JET_TEXT[f]){
      j[f] = (v === undefined || v === null || v === '') ? '' : String(v).trim();
    } else {
      j[f] = num(v);
    }
  });
  j.jetNo = no;
  if (!j.id) j.id = uid();
  if (!j.jetType) j.jetType = 'U Jet';
  if (!j.insulation) j.insulation = 'Insulated';
  if (!j.operation) j.operation = 'Hold';
  return j;
}

/* A port of JET-Eff's recalcJetSavings, to the digit. The report never
   invents a saving: it recomputes the app's arithmetic from the app's raw
   measurements, so if the cost parameters are edited here the numbers move
   the same way they would move in the app. */
function recalcJet(j, cost){
  cost = cost || S.jetCost;
  function rnd(v, d){ return Number(v.toFixed(d)); }
  function pos(v){ return (v !== null && v !== undefined && isFinite(v) && v > 0) ? v : 0; }
  var evap = pos(cost.evaporationRatio), fuelCost = pos(cost.fuelCost),
      unitRate = pos(cost.unitRate), insCost = pos(cost.insulationCost),
      days = pos(cost.days) || 350;

  var pumpInv = (j.pumpEfficiency !== null && j.pumpEfficiency !== undefined && j.pumpEfficiency < 40)
    ? pos(cost.pumpInvestmentCost) : 0;
  var trapInv = (j.trapStatus === 'Trap Passing' || j.concentricDrain === 'Drain before trap')
    ? pos(cost.trapReplacementCost) : 0;
  var heatHr = pos(j.heatingTimePerDay), runHr = pos(j.runningHrPerDay);

  j.insEqCoalSaving = (j.steamSaving != null && evap > 0) ? rnd(j.steamSaving / evap, 3) : null;
  j.insDailyFuelSaving = (j.insEqCoalSaving !== null && heatHr > 0) ? rnd(j.insEqCoalSaving * heatHr, 3) : null;
  j.insAnnualFuelSaving = j.insDailyFuelSaving !== null ? rnd((j.insDailyFuelSaving * days) / 1000, 3) : null;
  j.insInvestment = (insCost > 0 && pos(j.surfaceArea) > 0) ? rnd(insCost * j.surfaceArea, 2) : null;
  /* UNIT NOTE: insAnnualFuelSaving is in TONNE/yr and fuelCost is in RUPEES
     PER KG (6.5 for coal). JET-Eff multiplies them directly, which is a
     1000x under-statement - a jet saving 5 t/yr of coal comes out at Rs 34
     instead of Rs 34,125, and every ROI it feeds reads in centuries. The
     report converts to kg first. Anything the workbook already stored in
     these fields is recomputed, not trusted. */
  j.insMonitoringSaving = (j.insAnnualFuelSaving !== null && fuelCost > 0)
    ? rnd(j.insAnnualFuelSaving * 1000 * fuelCost, 2) : null;
  j.insRoiMonths = (j.insInvestment !== null && j.insMonitoringSaving > 0)
    ? rnd((j.insInvestment / j.insMonitoringSaving) * 12, 1) : null;

  j.pumpDailyPowerSaving = (j.pumpSavingKw != null && runHr > 0) ? rnd(j.pumpSavingKw * runHr, 2) : null;
  j.pumpAnnualPowerSaving = j.pumpDailyPowerSaving !== null ? rnd(j.pumpDailyPowerSaving * days, 2) : null;
  j.pumpMonitoringSaving = (j.pumpAnnualPowerSaving !== null && unitRate > 0)
    ? rnd(j.pumpAnnualPowerSaving * unitRate, 2) : null;
  j.pumpRoiMonths = (pumpInv > 0 && j.pumpMonitoringSaving > 0)
    ? rnd((pumpInv / j.pumpMonitoringSaving) * 12, 1) : null;

  j.trapEqFuelLoss = (j.trapEqSteamLoss != null && evap > 0) ? rnd(j.trapEqSteamLoss / evap, 3) : null;
  j.trapDailyFuelSaving = (j.trapEqFuelLoss !== null && heatHr > 0) ? rnd(j.trapEqFuelLoss * heatHr, 3) : null;
  j.trapAnnualFuelSaving = j.trapDailyFuelSaving !== null ? rnd((j.trapDailyFuelSaving * days) / 1000, 3) : null;
  j.trapMonitoringSaving = (j.trapAnnualFuelSaving !== null && fuelCost > 0)
    ? rnd(j.trapAnnualFuelSaving * 1000 * fuelCost, 2) : null;
  j.trapRoiMonths = (trapInv > 0 && j.trapMonitoringSaving > 0)
    ? rnd((trapInv / j.trapMonitoringSaving) * 12, 1) : null;

  j.pumpInvestment = pumpInv || null;
  j.trapInvestment = trapInv || null;
  return j;
}

/* The three savings streams and the money that follows from them, in one
   place. Every jet table, the KPI row, the donut and the ledger read this
   function - so they cannot disagree with each other. */
function jetTotals(j){
  /* A saving only counts where there is an action behind it. A trap that is
     working correctly still shows a small measured loss, and a pump above
     the benchmark still shows a theoretical gain - neither is money the
     plant can bank, and claiming it is what makes a report indefensible the
     moment the plant tries to realise it. So stream B counts only where the
     pump is actually being replaced and stream C only where the trap is.
     The per-jet rows still print the measured losses; they just do not add. */
  var a = num(j.insMonitoringSaving) || 0;
  var b = num(j.pumpInvestment) ? (num(j.pumpMonitoringSaving) || 0) : 0;
  var c = num(j.trapInvestment) ? (num(j.trapMonitoringSaving) || 0) : 0;
  var inv = (num(j.insInvestment) || 0) + (num(j.pumpInvestment) || 0) + (num(j.trapInvestment) || 0);
  var tot = a + b + c;
  return { a:a, b:b, c:c, total:tot, invest:inv,
           roi: (tot > 0 && inv > 0) ? (inv / tot) * 12 : (inv === 0 && tot > 0 ? 0 : null) };
}
function jetsRollUp(){
  var r = { n:S.jets.length, steam:0, ins:0, pump:0, trap:0, invest:0,
            effSum:0, effN:0, passing:[], weak:[], op:{ Heating:0, Cooling:0, Hold:0 } };
  S.jets.forEach(function(j){
    var t = jetTotals(j);
    r.steam += num(j.steamSaving) || 0;
    r.ins += t.a; r.pump += t.b; r.trap += t.c; r.invest += t.invest;
    if (num(j.pumpEfficiency) !== null){ r.effSum += num(j.pumpEfficiency); r.effN++; }
    if (j.trapStatus === 'Trap Passing') r.passing.push(j.jetNo);
    if (num(j.pumpEfficiency) !== null && num(j.pumpEfficiency) < 40) r.weak.push(j.jetNo);
    if (r.op[j.operation] === undefined) r.op[j.operation || 'Hold'] = 0;
    r.op[j.operation || 'Hold']++;
  });
  r.total = r.ins + r.pump + r.trap;
  r.avgEff = r.effN ? r.effSum / r.effN : null;
  r.roi = (r.total > 0 && r.invest > 0) ? (r.invest / r.total) * 12 : null;
  return r;
}
function importACmp(wb){
  var log = [];
  var rows = sheetRows(wb, 'Compressors');
  if (!rows.length) rows = sheetRows(wb, 'Compressor Entries');
  if (!rows.length) return log;
  S.compressor = rows.map(function(r){
    return { tag: pick(r,['machineTag','Machine Tag']) || '',
      make: pick(r,['makeModel','Make / Model']) || '',
      type: pick(r,['compressorType','Type']) || 'Screw',
      year: pick(r,['yearOfManufacture','Year']) || '',
      ratedCap: num(pick(r,['ratedCapacity','Rated Capacity'])),
      capUnit: pick(r,['ratedCapacityUnit','Capacity Unit']) || 'CFM',
      ratedPressure: num(pick(r,['ratedPressure'])),
      processPressure: num(pick(r,['processPressure'])),
      ratedKw: num(pick(r,['ratedKw','Rated kW'])),
      motorEff: num(pick(r,['motorEfficiency'])),
      testType: (num(pick(r,['pumpActualFadCfm'])) ? 'Pump-up' : 'FAD'),
      suctionArea: num(pick(r,['fadSuctionArea'])),
      avgVelocity: num(pick(r,['fadAvgVelocity'])),
      pumpP1: num(pick(r,['pumpP1'])), pumpP2: num(pick(r,['pumpP2'])),
      pumpTime: num(pick(r,['pumpTimeSec'])), tankVol: num(pick(r,['pumpTankVolume'])),
      measuredKw: num(pick(r,['genLoadKw','measuredKw','fadMeasuredPower'])),
      runningPressure: num(pick(r,['fadRunningPressure','pumpRunningPressure'])),
      loadHrs:null, unloadHrs:null, totalHrs:null, hoursPerDay:24,
      obs: pick(r,['description','fadDescription']) || '' };
  });
  S.enabled.compressor = true;
  log.push(S.compressor.length + ' compressors');
  return log;
}

FORMS.imports = function(w){
  var c = card('Import field data',
    'One door for every workbook. The file is identified from its own contents, checked against this report\u2019s company, then read into whichever modules it holds. Nothing is uploaded anywhere \u2014 it is read in this browser.');
  var mk = function(label, fn, hint){
    var i = el('input'); i.type='file'; i.accept='.xlsx,.xls,.csv';
    i.addEventListener('change', function(){
      var f = i.files && i.files[0]; if (!f) return;
      readWorkbook(f).then(function(wb){
        var log;
        try { log = fn(wb); }
        catch (err){ i.value = ''; alert(err.message); return; }
        i.value = '';
        save(); renderAll();
        alert(log.length ? ('Imported:\n\n\u2022 ' + log.join('\n\u2022 ')) :
          'Nothing recognised in that workbook. Sheets found: ' +
          Object.keys(wb.Sheets).join(', '));
      }).catch(function(e){ alert(e.message); });
    });
    return labelled(label, i, hint);
  };
  c.appendChild(mk('Drop any workbook here', importAny,
    'JET-Eff, A-CMP or a module workbook \u2014 the file is identified from its own sheet names, ' +
    'and if those were renamed, from its column headers. Only the modules it actually contains are touched.'));
  var note = el('p','','A workbook whose company name differs from this report is flagged, never silently overwritten. Re-importing a module replaces it rather than duplicating rows.');
  note.className = 'callout info';
  c.appendChild(note);

  var c3 = card('Module workbook',

/* ---- handing the viewer a file ----
   A plain <a download> is inert inside the hosted artifact viewer, so ask the
   platform when it is there and fall back to the anchor for the offline copy,
   where the anchor is the only thing that works. */
var DOWNLOADS = null;
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('downloads').then(function(d){ DOWNLOADS = d; }, function(){});
}
function anchorDownload(filename, text){
  var blob = new Blob([text], { type:'application/json' });
  var a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function offerFile(filename, text){
  if (DOWNLOADS){
    DOWNLOADS.save({ filename:filename, data:text }).catch(function(e){
      if (e && e.code === 'declined') return;
      if (e && (e.code === 'rate_limited')) { alert('A save prompt is already open.'); return; }
      anchorDownload(filename, text);
    });
    return;
  }
  anchorDownload(filename, text);
}

function atPath(path){
  var p = path.split('.'), o = S;
  for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
  return { parent:o, key:p[p.length - 1] };
}
function coerce(v, t){
  if (t === 'n') return num(v);
  if (t === 'b') return /^(y|yes|true|1|used)$/i.test(String(v).trim());
  return (v === undefined || v === null) ? '' : String(v).trim();
}

/* Reads every sheet it recognises, ignores every sheet it does not. A
   workbook holding only a Lux sheet imports lux and touches nothing else,
   so partial data from a walkthrough is always safe to load. */
function importModules(wb){
  var log = [], claimed = {};
  SHEETS.forEach(function(sp){
    var rows = sheetRows(wb, sp.name);
    if (!rows.length) return;
    var out = rows.map(function(r){
      var o = {};
      sp.cols.forEach(function(c){
        var v = r[c[1]];
        if (v === undefined || v === '') v = r[c[0]];
        o[c[0]] = coerce(v, c[2]);
      });
      return o;
    }).filter(function(o){
      /* A row is real if any cell in it is. Excel loves trailing blanks. */
      return sp.cols.some(function(c){ var v = o[c[0]]; return v !== '' && v !== null && v !== false; });
    });
    if (!out.length) return;
    if (sp.path === 'ledger') out.forEach(function(o){
      o.id = uid();
      if (!o.autoKey) delete o.autoKey;
    });
    var t = atPath(sp.path);
    t.parent[t.key] = out;
    var flag = { 'boiler.spec':'boiler', 'tfh.spec':'tfh', 'chiller.readings':'chiller',
                 'solar.rows':'solar', 'coolingTower':'coolingTower', 'compressor':'compressor',
                 'pumps':'pumps', 'lux':'lux', 'earth':'earth', 'sop':'sop' }[sp.path];
    if (flag) S.enabled[flag] = true;
    claimed[sp.name] = 1;
    log.push(out.length + ' ' + sp.label.toLowerCase());
  });
  /* Jet Data and the JET-Eff cost profile ride in the same workbook when
     the team exports from the app, so always give the jet reader a look. */
  if (wb.Sheets['Jet Data'] || wb.Sheets['Company Profile'])
    log = log.concat(importJetEff(wb, claimed));
  if (wb.Sheets['Compressors'] === undefined && (wb.Sheets['Compressor Entries'] || wb.Sheets['A-CMP']))
    log = log.concat(importACmp(wb));
  return log;
}

/* The same spec, written out empty (or full) as a workbook. This is the

function buildModuleWorkbook(withData){

/* XLSX.writeFile drives its own anchor, which the artifact viewer makes
   inert - so the bytes go through the same offerFile path everything else
   uses, base64 in hand. */
function offerWorkbook(filename, wb){
  var b64 = XLSX.write(wb, { type:'base64', bookType:'xlsx' });
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var blob = new Blob([arr], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if (DOWNLOADS){
    DOWNLOADS.save({ filename:filename, data:blob }).catch(function(e){
      if (e && e.code === 'declined') return;
      anchorBlob(filename, blob);
    });
    return;
  }
  anchorBlob(filename, blob);
}
function anchorBlob(filename, blob){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* ===================================================================
   WHAT IS THIS WORKBOOK, AND IS IT EVEN THIS PLANT?

   Two failures cost a report its credibility, and both are silent:
   dropping a file into the wrong reader so half of it is ignored, and
   dropping a file from a DIFFERENT plant so the report quietly mixes two
   companies. Neither should need the user to notice. The first is solved
   by identifying the workbook from its own contents; the second by
   refusing to import until a human says the names mean the same plant.
   =================================================================== */

/* Sheet names are matched loosely - a team member who saved the tab as
   "Lux Level" or "lux_data" still gets routed. */
function normKey(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function findSheet(wb, name){
  var want = normKey(name), names = Object.keys(wb.Sheets);
  for (var i = 0; i < names.length; i++) if (normKey(names[i]) === want) return names[i];
  for (i = 0; i < names.length; i++){
    var n = normKey(names[i]);
    if (n.indexOf(want) === 0 || want.indexOf(n) === 0) return names[i];
  }
  return null;
}
function headersOf(wb, name){
  var sh = wb.Sheets[name]; if (!sh) return [];
  var rows = XLSX.utils.sheet_to_json(sh, { header:1 });
  for (var i = 0; i < Math.min(rows.length, 5); i++){
    var r = rows[i] || [];
    var filled = r.filter(function(c){ return c !== '' && c !== null && c !== undefined; });
    if (filled.length >= 2) return filled.map(String);
  }
  return [];
}

/* Identify the workbook by what is inside it, not by what it is called.
   Returns every module it can see, so a mixed workbook routes to all of
   them rather than only to the first match. */
function detectWorkbook(wb){
  var names = Object.keys(wb.Sheets);
  var found = [], score = {};

  if (findSheet(wb, 'Jet Data')) found.push({ kind:'jets', label:'JET-Eff jet data', sheet:findSheet(wb, 'Jet Data') });
  SHEETS.forEach(function(sp){
    var s = findSheet(wb, sp.name);
    if (s) found.push({ kind:'module', label:sp.label, sheet:s, spec:sp });
  });
  if (!found.length){
    /* No recognisable tab name - fall back to the column headers, which
       survive renaming far better than sheet names do. */
    names.forEach(function(nm){
      var h = headersOf(wb, nm).map(normKey);
      if (!h.length) return;
      var best = null, bestHit = 0;
      SHEETS.forEach(function(sp){
        var hit = sp.cols.filter(function(c){
          return h.indexOf(normKey(c[1])) >= 0 || h.indexOf(normKey(c[0])) >= 0;
        }).length;
        if (hit > bestHit){ bestHit = hit; best = sp; }
      });
      var jetHit = JET_FIELDS.filter(function(f){ return h.indexOf(normKey(f)) >= 0; }).length;
      if (jetHit >= 6 && jetHit > bestHit){
        found.push({ kind:'jets', label:'jet data (recognised by its columns)', sheet:nm, renamed:true });
      } else if (best && bestHit >= Math.max(2, Math.ceil(best.cols.length * 0.4))){
        found.push({ kind:'module', label:best.label + ' (recognised by its columns)',
                     sheet:nm, spec:best, renamed:true });
      }
      score[nm] = bestHit;
    });
  }
  return { found:found, sheets:names };
}

/* Company identity. Read from wherever the exporting app happened to put
   it, then compared on meaningful words only: "Shree Mahadev Textiles Pvt.
   Ltd." and "SHREE MAHADEV TEXTILES PRIVATE LIMITED" are the same plant;
   "Shakti Enterprises" is not. */
var CO_NOISE = { pvt:1, private:1, ltd:1, limited:1, llp:1, inc:1, co:1, company:1,
                 the:1, and:1, m:1, s:1, ms:1, india:1, indian:1 };
function coTokens(name){
  return String(name || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/)
    .filter(function(t){ return t && !CO_NOISE[t]; });
}
function sameCompany(a, b){
  var x = coTokens(a), y = coTokens(b);
  if (!x.length || !y.length) return true;
  var hit = x.filter(function(t){ return y.indexOf(t) >= 0; }).length;
  /* Deliberately strict. A false alarm costs one confirmation dialog; a
     miss puts another plant's measurements into a signed report. At 0.75,
     "Shree Mahadev Silk Mills Pvt. Ltd." still matches "SHREE MAHADEV SILK
     MILLS PRIVATE LIMITED" but no longer matches "Shree Mahadev Textiles". */
  return hit / Math.min(x.length, y.length) >= 0.75;
}
function workbookCompany(wb){
  var keys = ['companyname','company','plantname','clientname','nameofcompany','unitname'];
  var names = Object.keys(wb.Sheets);
  for (var i = 0; i < names.length; i++){
    var sh = wb.Sheets[names[i]];
    var rows = XLSX.utils.sheet_to_json(sh, { header:1 });
    /* Field/Value shape, as JET-Eff writes it. */
    for (var r = 0; r < Math.min(rows.length, 40); r++){
      var row = rows[r] || [];
      if (row.length >= 2 && keys.indexOf(normKey(row[0])) >= 0 && row[1])
        return String(row[1]).trim();
    }
    /* Header/row shape. */
    var head = (rows[0] || []).map(normKey);
    for (var c = 0; c < head.length; c++){
      if (keys.indexOf(head[c]) >= 0 && rows[1] && rows[1][c])
        return String(rows[1][c]).trim();
    }
  }
  return null;
}

/* The single door every workbook comes through. Identifies it, checks the
   plant, then hands it to the readers that apply. Refusing here is the
   whole point: a mismatch is reported and nothing is written, so a report
   can never end up holding another company's measurements by accident. */
function importAny(wb){
  var det = detectWorkbook(wb);
  if (!det.found.length)
    throw new Error('Nothing in this workbook could be identified.\n\nSheets found: ' +
      det.sheets.join(', ') + '\n\nDownload the module template from this page and use its ' +
      'sheet names and headers, or export the file from JET-Eff.');

  var theirs = workbookCompany(wb), ours = S.company.name;
  if (theirs && ours && !sameCompany(theirs, ours)){
    var ok = confirm('DIFFERENT COMPANY\n\nThis workbook is for:\n    ' + theirs +
      '\n\nThis report is for:\n    ' + ours +
      '\n\nNothing has been imported. Importing would mix two plants\u2019 measurements into one ' +
      'report.\n\nPress Cancel to stop \u2014 this is almost always the right choice.\n' +
      'Press OK only if these two names are the same plant.');
    if (!ok) throw new Error('Import cancelled. That workbook belongs to ' + theirs + ', not to this report.');
  }
  if (theirs && !ours){ S.company.name = theirs; }

  var log = [];
  var kinds = {};
  det.found.forEach(function(f){ kinds[f.kind] = 1; });

  /* A tab whose NAME was not recognised is read through a shim that
     presents it under the name the readers expect. */
  var shim = wb, renamed = det.found.filter(function(f){ return f.renamed; });
  if (renamed.length){
    shim = { Sheets:{}, SheetNames:[] };
    Object.keys(wb.Sheets).forEach(function(n){ shim.Sheets[n] = wb.Sheets[n]; shim.SheetNames.push(n); });
    renamed.forEach(function(f){
      var target = f.kind === 'jets' ? 'Jet Data' : f.spec.name;
      shim.Sheets[target] = wb.Sheets[f.sheet];
      if (shim.SheetNames.indexOf(target) < 0) shim.SheetNames.push(target);
      log.push('read "' + f.sheet + '" as ' + target);
    });
  }

  log = log.concat(importModules(shim));
  if (!log.length) throw new Error('The sheets were recognised but every row in them was empty.');
  if (theirs) log.push('company verified as ' + theirs);
  return log;
}


/* ===================================================================
   CHARTS - plain SVG, no library, sized for the 456 pt live column.

   Rules held here: never two y-scales on one chart (two measures of
   different scale become two charts); one series needs no legend because
   the title names it; a standard's limit is drawn AND labelled; every
   axis carries its unit; series colour follows the entity, never its rank.
   =================================================================== */

var SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs){
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  return e;
}
function svText(x, y, text, opts){
  opts = opts || {};
  var t = sv('text', { x:x, y:y, 'text-anchor':opts.anchor || 'middle',
    'font-family': opts.mono ? "'IBM Plex Mono',monospace" : 'Archivo, Arial, sans-serif',
    'font-size': opts.size || 7.5, 'font-weight': opts.weight || 400,

/* Line chart with a labelled threshold band - power factor against 0.95. */

      stroke: i === 0 ? C.rule : '#EDF1F5', 'stroke-width': i === 0 ? 1 : 0.8 }));
    svg.appendChild(svText(pad.l - 4, yy + 2.4, vv.toFixed(2), { anchor:'end', size:6.8, mono:true }));

  labels.forEach(function(lb, i){
    var v = values[i];

  });

    'stroke-linejoin':'round', 'stroke-linecap':'round' }));

      stroke:'#fff', 'stroke-width':1.5 }));
