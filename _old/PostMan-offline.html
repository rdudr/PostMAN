   THE REPORT - one builder per section, in registry order.
   =================================================================== */
function buildReport(){
  var B = [];
  /* Heading ids restart with every build so they are identical across the
     contents-page passes - that stability is what makes the page numbers
     found in one pass valid in the next. */
  tocReset();
  B.push({ anchor:'start' });
  var t = rollUp(S.ledger);
  var co = S.company.name || '__________';

  /* --- Report control --- */
  B.push(blk(bH(1,'Report control')));
  B.push(tblBlock(null, [
    [{v:'Report No', tone:'head'}, reportNumber(S.meta.financialYear, S.meta.serial) + ' ' + (S.meta.revision||'')],
    [{v:'Report Date', tone:'head'}, longDate(S.meta.reportDate)],
    [{v:'Client', tone:'head'}, co],
    [{v:'Financial Year', tone:'head'}, S.meta.financialYear],
    [{v:'Assessment dates', tone:'head'},
      (S.meta.assessFrom ? longDate(S.meta.assessFrom) : '\u2014') + ' to ' + (S.meta.assessTo ? longDate(S.meta.assessTo) : '\u2014')],
    [{v:'Prepared by', tone:'head'}, S.meta.preparedBy || '\u2014'],
    [{v:'File name', tone:'head'}, reportFilename(S.meta.financialYear, S.meta.serial, co, S.meta.reportDate)]
  ], { colw:['32%','68%'] }));
  B.push(tblBlock(['IITGN energy assessment team','Contact'],
    S.team.iea.map(function(r){ return [r.name, r.role]; }), { colw:['42%','58%'] }));
  B.push({ anchor:'control' });
  /* The contents list is built here, but only once the page numbers exist. */
  B.push({ node:el('div'), split:false, tocAnchor:true });

  /* --- Acknowledgement / preface / disclaimer --- */
  B.push(blk(bH(1,'Acknowledgement')));
  DEFAULTS.acknowledgement.forEach(function(p){ B.push(blk(bP(fillTemplate(p)))); });
  B.push(blk(bP('Energy Assessor', { bold:true })));
  B.push(blk(bP('IEA \u2013 IIT Gandhinagar')));

  B.push(blk(bH(1,'Preface')));
  DEFAULTS.preface.forEach(function(p, i){ B.push(blk(bP(p, i===0 ? { bold:true } : null))); });

  B.push(blk(bH(1,'Disclaimer')));
  B.push(blk(bP(DEFAULTS.disclaimerIntro)));
  B.push(blk(bUL(DEFAULTS.disclaimerBullets)));
  B.push(blk(bP('Recommendations:', { bold:true })));
  B.push(blk(bP(DEFAULTS.disclaimerReco)));
  B.push({ anchor:'front' });

  /* --- Certificate: every figure from the ledger --- */
  B.push(blk(bH(1,'Certificate of energy assessment')));
  B.push(blk(bP(fillTemplate(DEFAULTS.certificate))));
  B.push(blk(bP(certificateSentence(t))));
  B.push(blk(bP(S.meta.preparedBy || 'Rahul Jayantibhai Patel', { bold:true })));
  B.push(blk(bP('CEA-30215, Lead GHG Verifier \u00B7 Project Manager II', { size:9.5 })));
  B.push(blk(bP('Industrial Energy Assessment Team \u2013 IIT Gandhinagar', { size:9.5 })));
  B.push({ anchor:'certificate' });

  /* --- Team --- */
  B.push(blk(bH(1,'Details of energy assessment team')));
  B.push(blk(bP('The following team was involved in the audit process for carrying out measurements, collection of data, and field study.')));
  B.push(blk(bP('Plant team:', { bold:true })));
  B.push(tblBlock(['Sr No','Name','Designation'],
    (S.team.plant.length ? S.team.plant : [{sr:'',name:'\u2014',role:''}]).map(function(r){
      return [r.sr, r.name, r.role]; }), { colw:['12%','40%','48%'] }));
  B.push(blk(bP('IEAC team \u2013 IIT Gandhinagar', { bold:true })));
  B.push(tblBlock(['Sr No','Name','Designation'],
    S.team.iea.map(function(r){ return [r.sr, r.name, r.role]; }), { colw:['12%','40%','48%'] }));
  B.push({ anchor:'team' });

  /* --- Executive summary --- */
  B.push(blk(bH(1,'Executive summary')));
  B.push(blk(bKPI([
    ['Electrical savings', inr(Math.round(t.elecKwh)) + ' kWh'],
    ['Thermal savings', inr(Math.round(t.thermalQty)) + ' ' + (S.baseline.thermalUnit||'')],
    ['Emissions', fix(t.co2) + ' tCO\u2082e'],
    ['Monetary', rupees(t.moneyTotal)],
    ['Investment', rupees(t.investment)],
    ['Payback', months(t.roi)]
  ])));
  B.push(blk(bP(certificateSentence(t))));
  B.push(blk(bP('All the recommendations are described in detail in the respective sections of this report. The annual cost savings and implementation costs represent our best estimates. The IITGN team welcomes inquiries and further discussion on any information or data contained in this report.')));

  B.push(blk(bH(2,'Observations and recommendations')));
  if (S.ledger.length){
    var recRows = [];
    var byModule = {};
    S.ledger.forEach(function(r){ (byModule[r.module] = byModule[r.module] || []).push(r); });
    var idx = 0;
    Object.keys(byModule).forEach(function(m){
      recRows.push([{ v:(MODULE_NAMES[m]||m).toUpperCase(), tone:'head', span:10 }]);
      byModule[m].forEach(function(r){
        idx++;
        var ps = pctSaving(r), roi = roiMonths(r);
        recRows.push([ idx, r.observation || '\u2014', r.recommendation || '\u2014',
          inr(num(r.consumption)), r.unit || '', inr(num(r.saving)),
          ps === null ? '\u2014' : fix(ps,1), rupees(num(r.monetary)),
          rupees(num(r.investment)), months(roi) ]);
      });
    });
    B.push(tblBlock(['Sr','Observation','Recommendation','Annual consumption','Unit',
      'Annual saving','% saving','Monetary saving','Investment','ROI months'],
      recRows, { size:7.6, colw:['4%','20%','22%','9%','6%','8%','6%','9%','8%','8%'] }));
  } else {
    B.push(blk(bNote('No recommendations recorded yet. Add them in the ledger and this table, the executive summary and the certificate all fill themselves.')));
  }

  B.push({ anchor:'summary' });

  /* --- Production --- */
  B.push(blk(bH(1,'Production process and description')));
  B.push(blk(bH(2,'Plant introduction')));
  (S.production.intro || '').split(/\n+/).filter(Boolean).forEach(function(p){ B.push(blk(bP(p))); });
  if (S.production.products.length){
    B.push(blk(bP('Products:', { bold:true })));
    B.push(tblBlock(['Sr. No.','Product','CAS / grade','Status'],
      S.production.products.map(function(r){ return [r.sr, r.product, r.cas, r.status]; }),
      { colw:['10%','40%','25%','25%'] }));
  }
  var loc = [];
  if (S.production.website) loc.push(['Website', S.production.website]);
  if (S.production.phone) loc.push(['Contact number', S.production.phone]);
  if (S.production.mail) loc.push(['Mail ID', S.production.mail]);
  if (S.production.factoryAddress) loc.push(['Factory address', S.production.factoryAddress]);
  if (loc.length){
    B.push(blk(bP('Plant location:', { bold:true })));
    B.push(tblBlock(null, loc.map(function(p){ return [{v:p[0],tone:'head'}, p[1]]; }), { colw:['28%','72%'] }));
  }
  if (S.assets.processFlow){
    B.push(blk(bH(2,'Process flow diagram and technology intervention')));
    B.push(blk(bImg(S.assets.processFlow, S.production.flowNote || 'Process flow diagram', 260)));
  }

  B.push({ anchor:'production' });

  /* --- Baseline --- */
  B.push(blk(bH(1,'Baseline of plant energy consumption')));
  var eRows = S.baseline.elec.filter(function(r){ return r.month; });
  if (eRows.length){
    B.push(blk(bH(2,'Baseline of plant energy consumption \u2013 electrical')));
    var eTot = eRows.reduce(function(a,r){ return a + (num(r.kwh)||0); },0);
    B.push(tblBlock(['Month','kWh','TOE'],
      eRows.map(function(r){
        var v = num(r.kwh);
        return [r.month, inr(v), v === null ? '\u2014' : (v*0.00008598).toFixed(3)];
      }).concat([[{v:'Total',tone:'head'}, {v:inr(Math.round(eTot)),tone:'head'},
        {v:(eTot*0.00008598).toFixed(3),tone:'head'}]]),
      { colw:['34%','33%','33%'] }));
    B.push(blk(bChart(chartBars(eRows.map(function(r){ return r.month; }),
      eRows.map(function(r){ return num(r.kwh) || 0; }),
      'Monthly electrical consumption', 'kWh', SERIES_NAME.electrical),
      'Purchased units, ' + S.meta.financialYear)));
  }
  var tRows = S.baseline.thermal.filter(function(r){ return r.month; });
  if (tRows.length){
    B.push(blk(bH(2,'Baseline of plant energy consumption \u2013 thermal')));
    var g = num(S.costs.gcv);
    B.push(tblBlock(['Month', (S.baseline.thermalName||'Fuel') + ' (' + (S.baseline.thermalUnit||'') + ')','TOE'],
      tRows.map(function(r){
        var v = num(r.qty);
        return [r.month, inr(v,2), (v !== null && g) ? ((v*g)/1e7).toFixed(3) : '\u2014'];
      }), { colw:['34%','33%','33%'] }));
    B.push(blk(bChart(chartBars(tRows.map(function(r){ return r.month; }),
      tRows.map(function(r){ return num(r.qty) || 0; }),
      'Monthly thermal consumption', S.baseline.thermalUnit || '', SERIES_NAME.thermal),
      (S.baseline.thermalName || 'Fuel') + ' consumed, ' + S.meta.financialYear)));
  }
  if (S.enabled.water && S.baseline.water.length){
    B.push(blk(bH(1,'Baseline of plant water consumption')));
    B.push(tblBlock(['Month','Water (m\u00B3)','Source'],
      S.baseline.water.map(function(r){ return [r.month, inr(num(r.m3)), r.source||'']; }),
      { colw:['34%','33%','33%'] }));
  }

  B.push({ anchor:'baseline' });

  /* --- GHG --- */
  B.push(blk(bH(1,'GHG emission accounting')));
  var elecTotal = S.baseline.elec.reduce(function(a,r){ return a + (num(r.kwh)||0); },0);
  var fuelTotal = S.baseline.thermal.reduce(function(a,r){ return a + (num(r.qty)||0); },0);
  var s2 = (elecTotal/1000) * (num(S.costs.gridEF)||0);
  var s1 = fuelTotal * (num(S.costs.fuelEF)||0) / 1000;
  B.push(blk(bH(2,'Boundaries of the emissions accounting')));
  B.push(blk(bP('Emissions accounting covers Scope 1 (direct, stationary combustion) and Scope 2 (indirect, purchased electricity). ' +
    (S.ghg.scope3Note || 'Scope 3 activity data was not available for this assessment and is excluded.'))));
  B.push(blk(bP('Scope 2 uses ' + S.costs.gridSrc + '. Scope 1 uses ' + S.costs.fuelSrc + '. Both factor versions are pinned into this report.', { size:9.5 })));
  B.push(blk(bH(2,'Summary of GHG emissions')));
  B.push(tblBlock(['Scope','Type of emission','Source','Emission tCO\u2082e'], [
    ['Scope 1','Stationary combustion', S.baseline.thermalName || 'Fuel', fix(s1)],
    ['Scope 2','Purchased electricity','Grid', fix(s2)],
    [{v:'Total',tone:'head'},{v:'',tone:'head'},{v:'',tone:'head'},{v:fix(s1+s2),tone:'head'}]
  ], { colw:['15%','35%','25%','25%'] }));

  B.push({ anchor:'ghg' });

  /* --- Bills --- */
  buildBillSection(B);

  B.push({ anchor:'bills' });

  /* --- Distribution --- */
  buildDistSection(B);

  B.push({ anchor:'dist' });

  /* --- PQ & transformer --- */
  buildTransformerSection(B);

  B.push({ anchor:'tr' });

  /* --- Utility modules --- */
  buildUtilities(B);

  B.push({ anchor:'utilities' });

  /* --- Instruments --- */
  var used = S.instruments.filter(function(r){ return r.used; });
  if (used.length){
    B.push(blk(bH(1,'Instruments')));
    B.push(blk(bP('The following instruments were used to carry out this assessment.')));
    B.push(tblBlock(['S.N.','Instrument','Make','Model','Qty'],
      used.map(function(r,i){ return [i+1, r.name, r.make, r.model, r.qty]; }),
      { colw:['8%','44%','18%','20%','10%'] }));
  }
  B.push({ anchor:'end' });
  return B;
}

function certificateSentence(t){
  var elecMoney = t.money.electrical, thermMoney = t.money.thermal;
  var billElec = S.bills.reduce(function(a,r){ return a + (num(r.net)||0); },0);
  var pe = billElec > 0 ? (elecMoney / billElec) * 100 : null;
  return 'An overall summary of the energy assessment observations and recommendations described in this report is listed in the table on the following pages. ' +
    'The estimated total value of energy savings on an annualised basis in electrical energy is ' + rupees(elecMoney) +
    (pe === null ? '' : ', which amounts to ' + fix(pe,1) + ' % of the current electricity bill') +
    ', and in thermal energy ' + rupees(thermMoney) + '. ' +
    'Towards achieving these savings the estimated investment is ' + rupees(t.investment) +
    ', giving an overall return on investment in ' + months(t.roi) + '. ' +
    'This also results in ' + fix(t.co2) + ' tonnes of CO\u2082 emission reduction.';
}


/* ===================================================================
   The three heaviest report sections, plus the utility modules.
   =================================================================== */

function buildBillSection(B){
  var d = billDerived();
  if (!d.rows.length) return;
  B.push(blk(bH(1,'Electricity bill analysis')));
  B.push(blk(bH(2,'Plant electricity bill analysis')));
  B.push(tblBlock(['Month','CD kVA','Actual MD','Billing dmd','kWh','kVAh','PF','Net \u20B9'],
    d.rows.map(function(r){
      var pf = num(r.pf) || (num(r.kwh) && num(r.kvah) ? num(r.kwh)/num(r.kvah) : null);
      return [r.month, inr(num(r.contract)), inr(num(r.actualMD)), inr(num(r.billingDemand)),
        inr(num(r.kwh)), inr(num(r.kvah)),
        { v: pf === null ? '\u2014' : fix(pf,3), tone: (pf !== null && pf < 0.95) ? 'bad' : null },
        inr(num(r.net))];
    }), { colw:['13%','10%','12%','12%','14%','14%','9%','16%'] }));

  B.push(blk(bP('Observations in electricity bills', { bold:true })));
  B.push(blk(bFormula([
    'Average units consumed          = ' + inr(Math.round(d.avgKwh)) + ' units/month',
    'Average actual maximum demand   = ' + fix(d.avgMD) + ' kVA',
    'Average power factor            = ' + fix(d.avgPF,3),
    'Contract demand                 = ' + inr(d.cd) + ' kVA',
    '',
    'Load factor    = avg kWh / (avg MD x avg PF x 24 x 30) = ' + fix(d.loadFactor,3),
    'Plant utility  = avg kWh / (CD x avg PF x 24 x 30)     = ' + fix(d.utilityFactor,3),
    'Demand factor  = avg actual MD / CD                    = ' + fix(d.demandFactor,3)
  ])));
  B.push(blk(bP('The higher the load factor, the better the utilisation of the equipment and installed capacity.')));

  B.push(blk(bH(2,'Contract demand vs actual and billing demand')));
  B.push(blk(bChart(chartGrouped(
    d.rows.map(function(r){ return r.month; }),
    [{ name:'Actual MD', color:SERIES[0], values:d.rows.map(function(r){ return num(r.actualMD)||0; }) },
     { name:'Billing demand', color:SERIES[1], values:d.rows.map(function(r){ return num(r.billingDemand)||0; }) }],
    'Demand trend', 'kVA',
    d.cd ? { value:d.cd, label:'Contract demand ' + inr(d.cd) + ' kVA' } : null),
    'Actual maximum demand against billing demand, with the sanctioned contract demand marked.')));

  B.push(blk(bH(2,'Annual power factor trend')));
  B.push(blk(bChart(chartLine(
    d.rows.map(function(r){ return r.month; }),
    d.rows.map(function(r){
      var p = num(r.pf); if (p) return p;
      var kwh = num(r.kwh), kvah = num(r.kvah);
      return (kwh && kvah) ? kwh/kvah : null;
    }),
    'Monthly power factor', 'PF', { value:0.95, label:'Desirable 0.95' }),
    'Months below 0.95 are marked and labelled \u2014 those are the months carrying a penalty.')));

  var night = d.rows.some(function(r){ return num(r.todNight); });
  if (night){
    B.push(blk(bH(2,'Time of day (TOD) in electricity bill')));
    B.push(blk(bChart(chartStacked(
      d.rows.map(function(r){ return r.month; }),
      [{ name:'Night', color:SERIES[2], values:d.rows.map(function(r){ return num(r.todNight)||0; }) },
       { name:'Peak', color:SERIES[1], values:d.rows.map(function(r){ return num(r.todPeak)||0; }) },
       { name:'Normal', color:SERIES[0], values:d.rows.map(function(r){
           return Math.max(0,(num(r.kwh)||0) - (num(r.todNight)||0) - (num(r.todPeak)||0)); }) }],
      'Time of day split', 'kWh'),
      'Night-hour units attract a rebate; peak-hour units a surcharge.')));
  }

  B.push(blk(bH(2,'Recommendation in electricity bills')));
  if (S.billNotes.pfNote) B.push(blk(bP(S.billNotes.pfNote)));
  if (S.billNotes.cdNote) B.push(blk(bP(S.billNotes.cdNote)));
  if (d.cd && d.maxMD){
    var headroom = ((d.cd - d.maxMD) / d.cd) * 100;
    if (headroom > 12) B.push(blk(bNote(
      'Highest recorded maximum demand is ' + inr(Math.round(d.maxMD)) + ' kVA against a contract demand of ' +
      inr(d.cd) + ' kVA \u2014 ' + fix(headroom,0) + ' % headroom. Contract demand optimisation is worth evaluating, ' +
      'remembering that billing demand will not fall below 85 % of whatever contract demand is set.')));
  }
  ledgerFor(B, 'bills', { heading:false });
}

function buildDistSection(B){
  if (!S.dist.pcc.length && !S.dist.motors.length && !S.dist.demand.avg) return;
  B.push(blk(bH(1,'Assessment of electrical distribution system')));
  if (S.dist.demand.avg !== null && S.dist.demand.avg !== undefined){
    B.push(blk(bH(2,'Plant load demand study')));
    B.push(tblBlock(['Mainline demand monitoring','Contract demand','Average','Minimum','Maximum'],
      [['Demand kVA', inr(num(S.dist.demand.contract)), fix(num(S.dist.demand.avg)),
        fix(num(S.dist.demand.min)), fix(num(S.dist.demand.max))]],
      { colw:['32%','17%','17%','17%','17%'] }));
    if (S.dist.demand.window) B.push(blk(bP('Recording window: ' + S.dist.demand.window, { size:9.5, italic:true })));
  }
  if (S.dist.pcc.length){
    B.push(blk(bH(2,'Plant section-wise energy consumption \u2014 electrical PCC load')));
    B.push(tblBlock(['Name of machine','Voltage','Current','kW','Q kVAr','kVA','PF','%V THD','%I THD'],
      S.dist.pcc.map(function(r){
        return [r.name, fix(num(r.v)), fix(num(r.i)), fix(num(r.kw)), fix(num(r.kvar)),
          fix(num(r.kva)), fix(num(r.pf),3),
          { v:fix(num(r.vthd)), tone:(num(r.vthd) > 5 ? 'bad' : null) },
          { v:fix(num(r.ithd)), tone:(num(r.ithd) > 8 ? 'bad' : null) }];
      }), { size:8, colw:['22%','10%','10%','9%','10%','9%','8%','11%','11%'] }));
    B.push(blk(bNote('Red cells exceed the IEEE-519:2022 limits of 5 % voltage THD and 8 % current THD.')));
  }
  if (S.dist.motors.length){
    B.push(blk(bH(2,'Motor load study')));
    B.push(tblBlock(['S.No','Name','Rated kW','Starter','Freq/rpm','Voltage','Current','kW','kVAr','kVA','PF','% Load'],
      S.dist.motors.map(function(r,i){
        var load = (num(r.kw) && num(r.rated)) ? (num(r.kw)/num(r.rated))*100 : null;
        return [i+1, r.name, fix(num(r.rated),1), r.starter, fix(num(r.freq),0),
          fix(num(r.v),0), fix(num(r.i),1), fix(num(r.kw),2), fix(num(r.kvar),2),
          fix(num(r.kva),2), fix(num(r.pf),3),
          { v: load === null ? '\u2014' : fix(load,1),
            tone: load === null ? null : (load > 100 ? 'bad' : (load < 50 ? 'watch' : 'ok')) }];
      }), { size:7.4, colw:['5%','19%','8%','7%','7%','7%','7%','7%','7%','7%','7%','12%'] }));
    B.push(blk(bNote('Above 100 % is an overloaded motor; below 50 % is an oversized one. The recommended band is 70\u201390 %.')));
    if (S.dist.motorNote) B.push(blk(bP(S.dist.motorNote)));
  }
  if (S.dist.apfc.length){
    B.push(blk(bH(2,'Automatic power factor correction study')));
    B.push(tblBlock(['Stage','Rated kVAr','Voltage','I-R','I-Y','I-B','Remark'],
      S.dist.apfc.map(function(r){
        return [r.stage, fix(num(r.rated),1), fix(num(r.v),0), fix(num(r.ir),1),
          fix(num(r.iy),1), fix(num(r.ib),1),
          { v:r.remark || '', tone:(/derat|fail|weak/i.test(r.remark||'') ? 'bad' : null) }];
      }), { colw:['14%','14%','12%','12%','12%','12%','24%'] }));
    if (S.dist.apfcNote) B.push(blk(bP(S.dist.apfcNote)));
  }
  ledgerFor(B, 'dist');
}

function buildTransformerSection(B){
  B.push(blk(bH(1,'Power quality and transformer assessment')));

  /* SLD - generated from the hierarchy, or a drawn one if supplied. */
  B.push(blk(bH(2,'Plant single line diagram')));
  if (S.assets.sldImage){
    B.push(blk(bImg(S.assets.sldImage, 'Plant single line diagram', 300)));
  } else if (S.sld.nodes.length){
    var built = sldSvg(true, false);
    B.push(blk(bChart(built.svg,
      'Generated from the panel hierarchy. Nodes breaching IEEE-519 are outlined in red; dashed nodes are provisional, recorded at the walkthrough and not yet confirmed.')));
  } else {
    B.push(blk(bNote('No single line diagram yet \u2014 build one from the panel tables in the Single line diagram section, or drop in a drawn one.')));
  }

  if (S.tr.capacity){
    B.push(blk(bH(3,'Rated details of transformer')));
    B.push(tblBlock(null, [
      [{v:'Make',tone:'head'}, S.tr.make || '\u2014', {v:'Capacity',tone:'head'}, inr(num(S.tr.capacity)) + ' kVA'],
      [{v:'Primary voltage',tone:'head'}, fix(num(S.tr.primaryV),0) + ' V', {v:'Secondary voltage',tone:'head'}, fix(num(S.tr.secondaryV),0) + ' V'],
      [{v:'Impedance',tone:'head'}, fix(num(S.tr.impedance),2) + ' %', {v:'Year',tone:'head'}, S.tr.year || '\u2014'],
      [{v:'No-load loss',tone:'head'}, fix(num(S.tr.noLoadLoss),2) + ' kW', {v:'Load loss',tone:'head'}, fix(num(S.tr.loadLoss),2) + ' kW'],
      [{v:'Oil quantity',tone:'head'}, S.tr.oilQty || '\u2014', {v:'Serial no.',tone:'head'}, S.tr.srNo || '\u2014']
    ], { colw:['22%','28%','22%','28%'] }));

    B.push(blk(bH(3,'Transformer efficiency monitoring')));
    B.push(tblBlock(null, [
      [{v:'Average loading',tone:'head'}, pct(num(S.tr.loading))],
      [{v:'Standard efficiency at this loading',tone:'head'}, pct(num(S.tr.stdEff),2)],
      [{v:'Actual load-based efficiency',tone:'head'},
       { v:pct(num(S.tr.actualEff),2),
         tone:(num(S.tr.actualEff) !== null && num(S.tr.stdEff) !== null && num(S.tr.actualEff) < num(S.tr.stdEff)) ? 'bad' : 'ok' }]
    ], { colw:['55%','45%'] }));

    B.push(blk(bH(3,'Power quality as per IEEE-519:2022 \u2014 harmonics')));

      B.push(tblBlock(['Measure','Applies to','Benefit','Priority'], [

        ['Active harmonic filter at the PCC','Main incomer','Cuts current THD at source','High'],

      ], { colw:['34%','22%','30%','14%'] }));

    if (stats.length){
      B.push(tblBlock(['Parameter','Average','Min','Max'],
        stats.map(function(s){
          var bad = /THD/i.test(s.p) &&
            ((/voltage/i.test(s.p) && num(s.avg) > 5) || (/current/i.test(s.p) && num(s.avg) > 8));
          return [s.p, { v:fix(num(s.avg)), tone: bad ? 'bad' : null }, fix(num(s.min)), fix(num(s.max))];

/* Every module ends with its own recommendations, drawn from the ledger. */
function ledgerFor(B, moduleId, opts){
  /* Every module ends with an anchor, whether or not it has recommendations,
     so a user-written section can be placed after any module in the report
     without touching the builder for that module. */
  var rows = S.ledger.filter(function(r){ return r.module === moduleId; });
  if (!rows.length){ B.push({ anchor:moduleId }); return; }
  /* A section that has already written its own recommendation heading says
     so, rather than getting a near-identical second one underneath it. */
  if (!(opts && opts.heading === false))
    B.push(blk(bH(2,'Recommendation in ' + (MODULE_NAMES[moduleId] || moduleId).toLowerCase())));
  rows.forEach(function(r, i){
    B.push(blk(bP((i+1) + '. ' + (r.recommendation || '\u2014'), { bold:false })));
    if (r.observation) B.push(blk(bP(r.observation, { size:9.8 })));
    B.push(blk(bFormula([
      'Annual energy saving    = ' + inr(num(r.saving)) + ' ' + (r.unit || ''),
      'Annual monetary saving  = ' + rupees(num(r.monetary)),
      'Investment              = ' + rupees(num(r.investment)),
      'Simple payback period   = ' + months(roiMonths(r))
    ])));
  });
  B.push({ anchor:moduleId });
}

        var m = (num(r.lux)&&num(r.watt)&&num(r.area)) ? (num(r.lux)*num(r.area))/num(r.watt) : null;
        return [i+1, r.location, fix(num(r.area),1), fix(num(r.lux),1), fix(m,1),
          fix(num(r.target),1), { v:fix(v,2), tone:tone }, { v:band, tone:tone }];
      }), { size:7.6 }));
    var counts = { Satisfactory:0, Review:0, Urgent:0, Immediate:0 };
    S.lux.forEach(function(r){ var b = ilerBand(ilerOf(r)); if (counts[b] !== undefined) counts[b]++; });
    B.push(tblBlock(['Assessment','No. of locations'],
      Object.keys(counts).map(function(k){ return [k, counts[k]]; }), { colw:['60%','40%'] }));
    ledgerFor(B, 'lux');

  if (S.enabled.solar && S.solar.rows.length){

    if (S.solar.rows.length > 1) B.push(blk(bChart(chartBars(
      S.solar.rows.map(function(r){ return r.month; }),
      S.solar.rows.map(function(r){ return num(r.gen)||0; }),
      'Solar generation', 'kWh', SERIES[3]), 'Monthly generation against installed ' +
      (S.solar.capacity ? fix(num(S.solar.capacity),0) + ' kWp' : 'capacity'))));
    if (S.solar.obs) B.push(blk(bP(S.solar.obs)));
    ledgerFor(B, 'solar');

  if (S.enabled.earth && S.earth.length){

function buildFired(B, data, title, moduleId){
  B.push(blk(bH(2, title)));
  DEFAULTS.boilerMethod.forEach(function(p){ B.push(blk(bP(p))); });
  if (data.spec.length){
    B.push(blk(bH(3,'Technical specification')));
    B.push(tblBlock(['Parameter','Value'], data.spec.map(function(r){ return [r.p, r.v]; }),
      { colw:['45%','55%'] }));
  }
  var d = data.direct, g = num(S.costs.gcv);
  var st = num(d.steam), fw = num(d.feedTemp), h = num(d.steamEnthalpy), fu = num(d.fuel);
  var effD = (st && h !== null && fw !== null && fu && g) ? ((st*(h-fw))/(fu*g))*100 : null;
  if (effD !== null){
    B.push(blk(bH(3,'Efficiency \u2014 direct method')));
    B.push(tblBlock(['Parameter','Value','Unit'], [
      ['Steam generated', fix(st,1), 'kg/hr'],
      ['Feed water temperature', fix(fw,1), '\u00B0C'],
      ['Steam enthalpy', fix(h,1), 'kcal/kg'],
      ['Fuel consumed', fix(fu,2), 'kg/hr'],
      ['GCV of fuel', fix(g,0), 'kcal/kg'],
      ['Evaporation ratio', fix(st/fu,2), '\u2014'],
      [{v:'Efficiency (direct)',tone:'head'}, {v:pct(effD),tone:'head'}, {v:'%',tone:'head'}]
    ], { colw:['48%','30%','22%'] }));
  }
  var ind = data.indirect;
  var ea = excessAir(ind.o2), dfl = dryFlueLoss(ind.o2, ind.tf, ind.ta, S.costs.gcv);
  if (dfl !== null){
    var rad = num(ind.radiation) || 0;
    B.push(blk(bH(3,'Efficiency \u2014 indirect method')));
    B.push(tblBlock(['Flue gas analysis','Value','Unit'], [
      ['Oxygen in flue gas', fix(num(ind.o2),2), '%'],
      ['Carbon monoxide', fix(num(ind.co),0), 'ppm'],
      ['Flue gas temperature', fix(num(ind.tf),1), '\u00B0C'],
      ['Ambient temperature', fix(num(ind.ta),1), '\u00B0C'],
      ['Excess air', { v:fix(ea,1), tone:(ea > 60 ? 'bad' : 'ok') }, '%'],
      ['Dry flue gas loss', fix(dfl,2), '%'],
      ['Radiation & unaccounted loss', fix(rad,2), '%'],
      [{v:'Efficiency (indirect)',tone:'head'}, {v:pct(100 - dfl - rad),tone:'head'}, {v:'%',tone:'head'}]
    ], { colw:['48%','30%','22%'] }));
    if (num(ind.o2) > 6) B.push(blk(bNote(
      'Oxygen of ' + fix(num(ind.o2),2) + ' % corresponds to roughly ' + fix(ea,0) +
      ' % excess air, well above the 4\u20136 % O\u2082 band for efficient combustion. Excess air raises dry flue gas losses directly.', 'bad')));
    if (num(ind.co) === 0) B.push(blk(bNote('CO of 0 ppm indicates complete combustion, so there is no incomplete-combustion loss to recover.', 'ok')));
  }
  if (data.obs) B.push(blk(bP(data.obs)));
  ledgerFor(B, moduleId);
}

/* ===================================================================
   JET MACHINE MODULE

   Three sources had to agree here:
     - the JET-Eff dashboard, which decides WHICH four charts and which
       KPIs an engineer already trusts;
     - the KISEM sample report, which decides the SHAPE of the printed
       tables - transposed, five jets to a page-width, grouped by the
       physical test that produced the row;
     - the recommendation ledger, which decides the money.
   Every number below is read back from jetTotals()/jetsRollUp(), so the
   KPI row, the donut, the per-jet tables and the recommendations are all
   the same arithmetic rendered four ways.
   =================================================================== */

  B.push(blk(bChart(chartBarsRef(labels,

/* ===================================================================
   CUSTOM PAGES AND THE TABLE OF CONTENTS

   Two things a generated report cannot do without.

   Custom pages: no registry, however carefully derived, survives contact
   with a real plant. There is always one thing - a thermal image, a photo
   of a cracked insulation jacket, a paragraph the client asked for - that
   belongs in the report and has no field anywhere. So the user can write
   their own section, drop photos into it, and say where it goes.

   Contents: page numbers only exist AFTER pagination, and inserting a
   contents page changes the page numbers it lists. That circularity is
   why this is done as a fixed-point iteration rather than in one pass.
   =================================================================== */

/* ---- heading register -------------------------------------------- */
/* buildReport resets this, so heading ids are stable across rebuilds:
   the same report always produces the same ids in the same order, which
   is what lets page numbers found in one pass be applied in the next. */
/* First flow page prints as 001. */
var PAGE_BADGE_OFFSET = 1;
var TOC_SEQ = 0;
function tocReset(){ TOC_SEQ = 0; }
function tocTag(node, level, text){
  node.dataset.toc = level;
  node.dataset.tocid = 'h' + (++TOC_SEQ);
  node.dataset.toctext = text;
  return node;
}

/* ---- custom sections --------------------------------------------- */
var CUSTOM_ANCHORS = [
  ['start','Right at the front, before everything'],
  ['control','After the report control page'],
  ['front','After the preface and disclaimer'],
  ['certificate','After the certificate'],
  ['team','After the assessment team'],
  ['summary','After the executive summary'],
  ['production','After the production process'],
  ['baseline','After the energy baseline'],
  ['ghg','After GHG accounting'],
  ['bills','After the bill analysis'],
  ['dist','After electrical distribution'],
  ['tr','After power quality and transformer'],
  ['boiler','After the boiler'],
  ['tfh','After the thermic fluid heater'],
  ['compressor','After the air compressor'],
  ['coolingTower','After the cooling tower'],
  ['chiller','After the chiller'],
  ['pumps','After the pumping system'],
  ['jets','After the jet machines'],
  ['lux','After the lux measurement'],
  ['solar','After the solar plant'],
  ['machines','After machine monitoring'],
  ['utilities','After all the utility sections'],
  ['end','At the very end, after the instruments']
];
function anchorLabel(id){
  for (var i = 0; i < CUSTOM_ANCHORS.length; i++)
    if (CUSTOM_ANCHORS[i][0] === id) return CUSTOM_ANCHORS[i][1];
  return id;
}

var CUSTOM_BLOCK_TYPES = [
  ['h2','Heading'],
  ['h3','Sub-heading'],
  ['p','Paragraph'],
  ['ul','Bullet list'],
  ['note','Highlighted note'],
  ['photo','Photograph'],
  ['photo2','Two photographs side by side'],
  ['table','Table'],
  ['kpi','Figure strip'],
  ['formula','Calculation block'],
  ['break','Start a new page here']
];

function newCustomBlock(type){
  return { id:uid(), type:type || 'p', text:'', head:'', rows:'', tone:'info',
           img:null, img2:null, cap:'', cap2:'', maxH:230 };
}
function newCustomSection(){
  return { id:uid(), title:'New section', anchor:'end', h1:true, on:true, landscapeNote:'',
           blocks:[ newCustomBlock('p') ] };
}

/* Renders one user-written section into report blocks. Everything here
   goes through the same block builders the generated sections use, so a
   hand-written page paginates, splits and prints identically - it is not
   a special case pasted on top. */
function buildCustomSection(B, sec){
  if (sec.h1 !== false && sec.title) B.push(blk(tocTag(bH(1, sec.title), 1, sec.title)));
  (sec.blocks || []).forEach(function(b){
    switch (b.type){
      case 'h2':
        if (b.text) B.push(blk(tocTag(bH(2, b.text), 2, b.text)));
        break;
      case 'h3':
        if (b.text) B.push(blk(bH(3, b.text)));
        break;
      case 'p':
        (b.text || '').split(/\n{2,}/).filter(Boolean).forEach(function(t){
          B.push(blk(bP(t.replace(/\n/g, ' '))));
        });
        break;
      case 'ul':
        var items = (b.text || '').split(/\n+/).map(function(t){ return t.replace(/^[-*\u2022]\s*/, '').trim(); })
                       .filter(Boolean);
        if (items.length) B.push(blk(bUL(items)));
        break;
      case 'note':
        if (b.text) B.push(blk(bNote(b.text, b.tone === 'info' ? null : b.tone)));
        break;
      case 'formula':
        var lines = (b.text || '').split(/\n/);
        if (lines.length) B.push(blk(bFormula(lines)));
        break;
      case 'photo':
        if (b.img) B.push(blk(bImg(b.img, b.cap || '', num(b.maxH) || 230)));
        break;
      case 'photo2':
        if (b.img || b.img2) B.push(blk(bImgPair(b.img, b.img2, b.cap, b.cap2)));
        break;
      case 'table':
        var head = (b.head || '').split('|').map(function(t){ return t.trim(); }).filter(Boolean);
        var rows = (b.rows || '').split(/\n+/).filter(function(l){ return l.trim(); })
          .map(function(l){ return l.split('|').map(function(t){ return t.trim(); }); });
        if (rows.length) B.push(tblBlock(head.length ? head : null, rows, { size:9 }));
        break;
      case 'kpi':
        var pairs = (b.text || '').split('|').map(function(t){
          var p = t.split('='); return [ (p[0]||'').trim(), (p[1]||'').trim() ];
        }).filter(function(p){ return p[0]; });
        if (pairs.length) B.push(blk(bKPI(pairs)));
        break;
      case 'break':
        B.push({ node:el('div'), split:false, hardBreak:true });
        break;
    }
  });
}

/* Two photographs on one line - the commonest thing an auditor wants and
   the fiddliest to do by hand. Widths are halves of the live column, so
   the pair can never push the page sideways. */
function bImgPair(a, b, capA, capB){
  var d = el('div','display:flex;gap:' + px(8) + ';margin:0 0 ' + px(8) + ';align-items:flex-start;');
  var cellW = (LIVE.w * PT - 8 * PT) / 2;
  /* Both cells reserve the height of the taller picture, so the pair keeps a
     fixed box whichever photograph decodes first - see imgBox. */
  var hh = 0;
  [a, b].forEach(function(x){ if (x) hh = Math.max(hh, imgBox(x, cellW, 190 * PT).h); });
  [[a, capA], [b, capB]].forEach(function(p){
    var cell = el('div','flex:1 1 0;min-width:0;');
    if (p[0]){
      var bx = imgBox(p[0], cellW, 190 * PT);
      var i = el('img','display:block;width:' + bx.w + 'px;height:' + bx.h +
        'px;margin:0 auto;object-fit:contain;');
      i.width = bx.w; i.height = bx.h;
      i.src = p[0].dataUrl; i.alt = p[1] || 'Figure';
      cell.appendChild(i);
    } else if (hh){
      cell.appendChild(el('div','height:' + hh + 'px;'));
    }
    if (p[1]) cell.appendChild(el('div','font-size:' + px(8.5) + ';font-style:italic;color:' + C.ink3 +
      ';text-align:center;margin-top:' + px(3), p[1]));
    d.appendChild(cell);
  });
  return d;
}

/* Splices every user section into the block stream at its anchor, then
   drops the anchor markers. Anchors carry no node, so anything left over
   is filtered before the flow engine ever sees it. */
function spliceCustom(B){
  var out = [];
  B.forEach(function(b){
    if (b.anchor){
      (S.custom || []).forEach(function(sec){
        if (sec.anchor === b.anchor && sec.on !== false) buildCustomSection(out, sec);
      });
      return;
    }
    out.push(b);
  });
  return out.filter(function(b){ return b.node; });
}

/* ---- table of contents ------------------------------------------- */
/* One block per line, so the flow engine pages a long contents list the
   same way it pages anything else and no special split logic is needed. */
function buildTocBlocks(entries){
  var out = [];
  out.push(blk(bH(1,'Contents')));
  out.push(blk(bP('Every heading in this report, with the page it starts on.', { size:9.5, italic:true })));
  entries.forEach(function(e){
    var lvl = Number(e.level);
    var row = el('div','display:flex;align-items:baseline;gap:' + px(4) +
      ';margin:0 0 ' + px(lvl === 1 ? 3 : 1.5) + ';padding-left:' + px(lvl === 1 ? 0 : 12) +
      ';font-size:' + px(lvl === 1 ? 10 : 9.3) + ';' +
      (lvl === 1 ? 'font-weight:600;color:' + C.navy + ';' : 'color:' + C.charcoal + ';'));
    row.appendChild(el('span','flex:0 1 auto;', e.text));
    row.appendChild(el('span','flex:1 1 auto;border-bottom:' + px(0.6) + ' dotted ' + C.rule +
      ';transform:translateY(' + px(-2) + ');min-width:' + px(10)));
    row.appendChild(el('span','flex:0 0 auto;font-family:' + F.mono + ';font-size:' + px(8.6) +
      ';color:' + C.ink3 + ';', e.page === null ? '\u2014' : String(e.page)));
    /* Clickable in the on-screen preview; inert, and identical, in print. */
    if (e.page !== null){ row.dataset.gotopage = e.page; row.style.cursor = 'pointer'; }
    out.push(blk(row));
  });
  return out;
}

/* Reads the page each heading landed on, by walking the paginated pages.

   The cover is not part of the flow and carries no page badge, so the first
   flow page IS printed as 001 - the offset is zero, not one. Getting this
   wrong puts every number in the contents one page late, which is the kind
   of error nobody notices until a client turns to page 14 and finds 13. */
function tocMapFromPages(pages, offset){
  var map = {};
  pages.forEach(function(page, i){
    var hs = page.querySelectorAll('[data-tocid]');
    for (var k = 0; k < hs.length; k++){
      var id = hs[k].dataset.tocid;
      if (map[id] === undefined) map[id] = i + offset;
    }
  });
  return map;
}
function tocEntriesFrom(blocks, map){
  var out = [];
  blocks.forEach(function(b){
    if (!b.node || !b.node.dataset) return;
    var id = b.node.dataset.tocid;
    if (!id) return;
    out.push({ id:id, level:b.node.dataset.toc, text:b.node.dataset.toctext,
               page: map[id] === undefined ? null : map[id] });
  });
  return out;
}

/* The fixed point. Inserting the contents list pushes everything after it
   down, which changes the very numbers being listed. Two or three passes
   settle it; if it has not settled by then the numbers are off by one
   somewhere harmless, and looping forever would be worse. */
function paginateWithToc(){
  if (!S.meta.toc){
    var plain = spliceCustom(buildReport());
    return { pages: paginate(plain), entries: [] };
  }
  var entries = [], pages = null, blocks = null, lastCount = -1;
  for (var pass = 0; pass < 4; pass++){
    blocks = spliceCustom(buildReport());
    var at = -1;
    for (var i = 0; i < blocks.length; i++) if (blocks[i].tocAnchor){ at = i; break; }
    if (at < 0) return { pages: paginate(blocks), entries: [] };
    /* The contents belongs on its own page, so it is fenced by hard breaks
       rather than allowed to share a page with whatever precedes it. */
    var toc = [{ node:el('div'), split:false, hardBreak:true }]
      .concat(buildTocBlocks(entries))
      .concat([{ node:el('div'), split:false, hardBreak:true }]);
    blocks.splice.apply(blocks, [at, 1].concat(toc));
    pages = paginate(blocks);
    var map = tocMapFromPages(pages, PAGE_BADGE_OFFSET);
    entries = tocEntriesFrom(blocks, map).filter(function(e){
      /* The contents page does not list itself. */
      return e.text !== 'Contents';
    });
    if (pages.length === lastCount && pass > 0) break;
    lastCount = pages.length;
  }
  return { pages:pages, entries:entries };
}

/* ---- the editor --------------------------------------------------- */
FORMS.custom = function(w){
  var c = card('Your own pages',
    'Anything the generated sections cannot hold. Write it here, drop photographs in, and choose where in the report it belongs \u2014 it paginates, splits and prints exactly like a generated section, because it goes through the same builders.');
  c.appendChild(fCheck(S.meta, 'toc', 'Include a Contents page (headings and their page numbers)'));
  c.appendChild(btn('+ Add a section', function(){
    S.custom.push(newCustomSection()); save(); renderAll();
  }));
  w.appendChild(c);

  if (!S.custom.length){
    var e = card('Nothing added yet',
      'A section is a title, a place in the report, and any number of blocks: paragraphs, bullets, photographs (one or two across), tables, figure strips, calculation blocks and page breaks.');
    w.appendChild(e);
    return;
  }

  S.custom.forEach(function(sec, si){
    var cc = card(sec.title || 'Untitled section', anchorLabel(sec.anchor));
    cc.appendChild(gridOf([
      fText(sec, 'title', 'Section title'),
      fSelect(sec, 'anchor', 'Where it goes',
        CUSTOM_ANCHORS.map(function(a){ return { v:a[0], t:a[1] }; }))
    ], true));
    var opts = el('div','display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:4px 0 12px;');
    opts.appendChild(fCheck(sec, 'h1', 'Print the title as a section heading'));
    opts.appendChild(fCheck(sec, 'on', 'Include in this report'));
    cc.appendChild(opts);

    sec.blocks.forEach(function(b, bi){
      cc.appendChild(customBlockEditor(sec, b, bi));
    });

    var bar = el('div','display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;');
    CUSTOM_BLOCK_TYPES.forEach(function(t){
      bar.appendChild(btn('+ ' + t[1], function(){
        sec.blocks.push(newCustomBlock(t[0])); save(); renderAll();
      }, 'sm'));
    });
    cc.appendChild(bar);

    var foot = el('div','display:flex;gap:6px;margin-top:12px;');
    if (si > 0) foot.appendChild(btn('Move section up', function(){
      S.custom.splice(si-1, 0, S.custom.splice(si,1)[0]); save(); renderAll(); }, 'sm'));
    foot.appendChild(btn('Delete section', function(){
      if (confirm('Delete "' + (sec.title||'this section') + '" and everything in it?')){
        S.custom.splice(si,1); save(); renderAll(); } }, 'sm'));
    cc.appendChild(foot);
    w.appendChild(cc);
  });
};

function customBlockEditor(sec, b, bi){
  var box = el('div','border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin:0 0 10px;');
  var head = el('div','display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;');
  var name = '';
  CUSTOM_BLOCK_TYPES.forEach(function(t){ if (t[0] === b.type) name = t[1]; });
  head.appendChild(el('span','font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;', name));
  var tools = el('div','display:flex;gap:5px;');
  if (bi > 0) tools.appendChild(btn('\u2191', function(){
    sec.blocks.splice(bi-1, 0, sec.blocks.splice(bi,1)[0]); save(); renderAll(); }, 'sm'));
  if (bi < sec.blocks.length - 1) tools.appendChild(btn('\u2193', function(){
    sec.blocks.splice(bi+1, 0, sec.blocks.splice(bi,1)[0]); save(); renderAll(); }, 'sm'));
  tools.appendChild(btn('Remove', function(){ sec.blocks.splice(bi,1); save(); renderAll(); }, 'sm'));
  head.appendChild(tools);
  box.appendChild(head);

  switch (b.type){
    case 'h2': case 'h3':
      box.appendChild(fText(b, 'text', 'Heading text'));
      break;
    case 'p':
      box.appendChild(fArea(b, 'text', 'Text',
        'A blank line starts a new paragraph.'));
      break;
    case 'ul':
      box.appendChild(fArea(b, 'text', 'Bullets', 'One per line.'));
      break;
    case 'note':
      box.appendChild(fArea(b, 'text', 'Note text'));
      box.appendChild(fSelect(b, 'tone', 'Tone', [
        { v:'info', t:'Neutral (blue)' }, { v:'ok', t:'Good (green)' }, { v:'bad', t:'Problem (red)' }]));
      break;
    case 'formula':
      box.appendChild(fArea(b, 'text', 'Calculation',
        'Monospaced, one line each \u2014 line up the = signs and they stay lined up in print.'));
      break;
    case 'photo':
      box.appendChild(fImage(b, 'img', 'Photograph'));
      box.appendChild(gridOf([
        fText(b, 'cap', 'Caption'),
        fNum(b, 'maxH', 'Maximum height on the page, pt', '230')
      ], true));
      break;
    case 'photo2':
      box.appendChild(gridOf([ fImage(b, 'img', 'Left photograph'),
                               fImage(b, 'img2', 'Right photograph') ], true));
      box.appendChild(gridOf([ fText(b, 'cap', 'Left caption'),
                               fText(b, 'cap2', 'Right caption') ], true));
      break;
    case 'table':
      box.appendChild(fText(b, 'head', 'Column headings',
        'Separated by a vertical bar, like:  Parameter | Value | Unit'));
      box.appendChild(fArea(b, 'rows', 'Rows',
        'One row per line, cells separated by a vertical bar. A long table splits across pages and repeats its heading.'));
      break;
    case 'kpi':
      box.appendChild(fArea(b, 'text', 'Figures',
        'Label = value, separated by a vertical bar. For example:  Jets surveyed = 46 | Steam saving = 32.4 kg/hr'));
      break;
    case 'break':
      box.appendChild(el('p','font-size:12px;color:var(--ink-3);margin:0',
        'Everything after this starts on a fresh page.'));
      break;
  }
  return box;
}


/* ===================================================================
   BILL CAPTURE AND VERIFICATION

   OCR on an electricity bill does not fail the way people expect. It
   rarely fails to read the characters; it fails to know which number is
   which. A DGVCL bill has forty numbers on it and the one labelled
   "Billing Demand" sits in a different place on every DISCOM's layout.
   So the text layer is only half the job - the other half is anchoring on
   the LABEL and taking the number that belongs to it.

   And it will still be wrong sometimes, on a creased photo or a scan at
   an angle. So the design assumption here is that OCR is an assistant,
   never an authority: every figure passes under a human eye with the bill
   itself on screen beside it, and a bill is not counted until someone
   presses Verify. A report is signed by a person; the numbers in it
   should have been looked at by one.
   =================================================================== */

var BILL_FIELDS = [
  { k:'month',        t:'Billing month',     type:'text' },
  { k:'contract',     t:'Contract demand',   unit:'kVA' },
  { k:'actualMD',     t:'Actual maximum demand', unit:'kVA' },
  { k:'billingDemand',t:'Billing demand',    unit:'kVA' },
  { k:'kwh',          t:'Units consumed',    unit:'kWh' },
  { k:'kvah',         t:'Apparent energy',   unit:'kVAh' },
  { k:'pf',           t:'Power factor',      unit:'' },
  { k:'energyCharge', t:'Energy charge',     unit:'\u20B9' },
  { k:'demandCharge', t:'Demand charge',     unit:'\u20B9' },
  { k:'fuelSurcharge',t:'Fuel surcharge (FPPPA)', unit:'\u20B9' },
  { k:'duty',         t:'Electricity duty',  unit:'\u20B9' },
  { k:'other',        t:'Other charges',     unit:'\u20B9' },
  { k:'rebate',       t:'Rebate / discount', unit:'\u20B9' },
  { k:'net',          t:'Net payable',       unit:'\u20B9' },
  { k:'todNight',     t:'TOD night units',   unit:'kWh' },
  { k:'todPeak',      t:'TOD peak units',    unit:'kWh' }
];

/* Label aliases, longest and most specific first: "billing demand" must be
   tried before "demand", or every bill reports its contract demand as its
   billing demand. Drawn from DGVCL, UGVCL, MGVCL, PGVCL, Torrent and Adani
   layouts, which is most of what a Gujarat plant will hand over. */
var BILL_PATTERNS = [
  ['billingDemand', ['billing demand','billable demand','demand billed','chargeable demand','b\\.?d\\.?']],
  ['contract',      ['contract demand','contracted demand','sanctioned demand','sanctioned load','contract load','c\\.?d\\.?']],
  ['actualMD',      ['maximum demand recorded','recorded maximum demand','actual maximum demand',
                     'maximum demand','max\\.? demand','recorded demand','actual demand','m\\.?d\\.?']],
  ['kvah',          ['total kvah','kvah consumed','kvah consumption','apparent energy','kvah']],
  ['kwh',           ['total units consumed','units consumed','net units','total consumption',
                     'energy consumed','kwh consumed','consumption in kwh','total kwh','units','kwh']],
  ['pf',            ['average power factor','avg\\.? power factor','power factor','p\\.?f\\.?']],
  ['energyCharge',  ['energy charge','energy charges']],
  ['demandCharge',  ['demand charge','demand charges']],
  ['fuelSurcharge', ['fpppa','fppa','fuel price and power purchase','fuel surcharge',
                     'fuel cost adjustment','fuel price adjustment','f\\.?c\\.?a\\.?']],
  ['duty',          ['electricity duty','govt\\.? duty','government duty','duty']],
  /* Without this the charge lines never add up to the net, and the check
     cries wolf on every bill - which is worse than not checking at all,
     because a warning that is always on gets ignored when it is real. */
  ['other',         ['other charges','other charge','miscellaneous charges','misc\\.? charges','other amount']],
  ['rebate',        ['prompt payment rebate','rebate','discount']],
  ['net',           ['net amount payable','amount payable','net payable','total amount payable',
                     'bill amount','net bill amount','grand total','total payable','net amount']],
  ['todNight',      ['tod night','night hours','off peak units','zone c','night units','tod-3','tod 3']],
  ['todPeak',       ['tod peak','peak hours','peak units','zone b','tod-2','tod 2']]
];

var MONTH_WORDS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

/* Indian digit grouping, currency marks and stray spaces inside numbers all
   have to go before parseFloat sees anything. "1,23,456.78" is one number. */
function billNum(raw){
  if (raw === null || raw === undefined) return null;
  var s = String(raw).replace(/[\u20B9$]/g,'').replace(/,/g,'').replace(/\s+/g,'');
  var m = s.match(/-?\d+(?:\.\d+)?/);
  if (!m) return null;
  var v = parseFloat(m[0]);
  return isFinite(v) ? v : null;
}

/* Given a line of text and the label that matched inside it, take the first
   number AFTER the label. Falling back to the last number on the line is
   wrong often enough to matter - many bills print a rate and an amount on
   the same row, and the rate comes second. */
function numberAfter(line, at){
  var tail = line.slice(at);
  var m = tail.match(/[-+]?[\d,]*\d(?:\.\d+)?/);
  return m ? billNum(m[0]) : null;
}

function extractBill(text){
  var hits = {};
  if (!text) return hits;
  var lines = String(text).split(/\r?\n/).map(function(l){ return l.replace(/\s+/g,' ').trim(); })
                          .filter(Boolean);
  var used = {};
  BILL_PATTERNS.forEach(function(pat){
    var field = pat[0];
    if (hits[field] !== undefined) return;
    for (var a = 0; a < pat[1].length && hits[field] === undefined; a++){
      var re = new RegExp('\\b' + pat[1][a] + '\\b', 'i');
      for (var i = 0; i < lines.length; i++){
        if (used[i + ':' + field]) continue;
        var m = re.exec(lines[i]);
        if (!m) continue;
        var v = numberAfter(lines[i], m.index + m[0].length);
        /* Some layouts put the label on one line and the figure on the next. */
        if (v === null && lines[i+1]) v = billNum(lines[i+1]);
        if (v === null) continue;
        hits[field] = { value:v, line:lines[i], via:pat[1][a] };
        break;
      }
    }
  });
  /* Month: a month word plus a two or four digit year, anywhere. */
  var mm = String(text).match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-\/']*((?:19|20)?\d{2})\b/i);
  if (mm){
    var name = mm[1][0].toUpperCase() + mm[1].slice(1,3).toLowerCase();
    var yr = mm[2].length === 4 ? mm[2].slice(2) : mm[2];
    hits.month = { value:name + ' ' + yr, line:mm[0], via:'month name' };
  }
  /* A power factor read as 950 or 95 is a percentage, not a factor. */
  if (hits.pf && hits.pf.value > 1.2){
    hits.pf.value = hits.pf.value > 10 ? hits.pf.value / 1000 : hits.pf.value / 100;
    hits.pf.note = 'read as a percentage and converted';
  }
  return hits;
}

/* ---- checks ------------------------------------------------------- */
/* Things that are arithmetically impossible, and things that are merely
   suspicious, kept apart. An impossible value is almost always a
   misreading; a suspicious one is sometimes the finding. */
function billChecks(b){
  var out = [];
  var kwh = num(b.kwh), kvah = num(b.kvah), pf = num(b.pf);
  var cd = num(b.contract), md = num(b.actualMD), bd = num(b.billingDemand);
  if (kwh !== null && kvah !== null && kwh > kvah + 0.5)
    out.push({ bad:true, t:'kWh is greater than kVAh, which cannot happen \u2014 one of the two is misread.' });
  if (pf !== null && (pf <= 0 || pf > 1.02))
    out.push({ bad:true, t:'Power factor of ' + fix(pf,3) + ' is outside 0\u20131.' });
  if (pf !== null && kwh && kvah){
    var calc = kwh / kvah;
    if (Math.abs(calc - pf) > 0.02)
      out.push({ bad:true, t:'Power factor on the bill is ' + fix(pf,3) + ' but kWh/kVAh gives ' + fix(calc,3) + '.' });
  }
  if (cd !== null && md !== null && md > cd * 1.6)
    out.push({ bad:true, t:'Maximum demand is more than 60 % above contract demand \u2014 check the reading.' });
  if (bd !== null && cd !== null && bd < cd * 0.85 - 1)
    out.push({ t:'Billing demand is below 85 % of contract demand, which most tariffs do not allow.' });
  if (cd !== null && md !== null && md < cd * 0.7)
    out.push({ t:'Maximum demand is only ' + pct((md/cd)*100,0) + ' of contract demand \u2014 worth a contract demand recommendation.' });
  if (pf !== null && pf < 0.95)
    out.push({ t:'Power factor below 0.95 \u2014 this month carries a penalty.' });
  var parts = ['energyCharge','demandCharge','fuelSurcharge','duty','other']
    .reduce(function(a,k){ return a + (num(b[k])||0); }, 0) - (num(b.rebate)||0);
  var net = num(b.net);
  if (net !== null && parts > 0 && Math.abs(parts - net) > 5)
    out.push({ t:'Charges add to \u20B9 ' + inr(Math.round(parts)) + ' but net payable reads \u20B9 ' +
      inr(Math.round(net)) + ' \u2014 off by ' + inr(Math.round(Math.abs(parts-net))) + '.' });
  return out;
}
function billMissing(b){
  return ['month','contract','actualMD','billingDemand','kwh','kvah','net'].filter(function(k){
    return k === 'month' ? !b.month : num(b[k]) === null;
  });
}
function billsProgress(){
  var total = S.bills.length;
  var done = S.bills.filter(function(b){ return b.verified; }).length;
  return { total:total, done:done, left:total - done };
}
function nextUnverified(from){
  for (var i = 1; i <= S.bills.length; i++){
    var j = (from + i) % S.bills.length;
    if (!S.bills[j].verified) return j;
  }
  return -1;
}

/* ---- loading the library that does the reading -------------------- */
/* Both of these come from a CDN and both can be unavailable: offline, or
   blocked by the page's content policy. Neither is load-bearing - the
   workspace works with no library at all, you just type more - so failure
   is reported plainly and the tool carries on. */
var LIBS = {};
function loadScript(url){
  if (LIBS[url]) return LIBS[url];
  LIBS[url] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = url;
    s.onload = function(){ res(true); };
    s.onerror = function(){ rej(new Error('Could not load ' + url)); };
    document.head.appendChild(s);
  });
  return LIBS[url];
}
var PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
/* pdf.js wants a Worker, and it cannot have one here: `new Worker(url)` on a
   cross-origin URL is a SecurityError in every browser, and the usual dodge -
   fetch the worker and hand it over as a blob - is a network request that a
   published page's content policy refuses. The way through is pdf.js's own
   fallback: if `globalThis.pdfjsWorker` already holds the worker's message
   handler, it runs the worker code on the main thread instead of trying to
   spawn one. Loading pdf.worker.min.js as an ordinary script tag is what puts
   it there. Slower on a big PDF, but a bill is one page of text. */
function ensurePdfJs(){
  if (window.pdfjsLib && window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  return loadScript(PDFJS_BASE + 'pdf.min.js')
    .then(function(){ return loadScript(PDFJS_BASE + 'pdf.worker.min.js').catch(function(){ /* fall through */ }); })
    .then(function(){
      if (!window.pdfjsLib) throw new Error('pdf.js did not register itself.');
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; } catch (e) {}
      if (!window.pdfjsWorker)
        throw new Error('The PDF worker could not be loaded, so PDFs cannot be opened here.');
      return window.pdfjsLib;
    });
}
function ensureTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js')
    .then(function(){
      if (!window.Tesseract) throw new Error('tesseract.js did not register itself.');
      return window.Tesseract;
    });
}

/* ---- ingestion ---------------------------------------------------- */
/* A bill is one page. Twelve months may arrive as one twelve-page PDF, as
   twelve separate PDFs, or as twelve photographs - all three end up as the
   same list of pages, each with a picture and whatever text could be had. */
function ingestBillPdf(file, onPage){
  return ensurePdfJs().then(function(pdfjs){
    return readFileBuffer(file).then(function(buf){
      return pdfjs.getDocument({ data:new Uint8Array(buf) }).promise;
    });
  }).then(function(doc){
    var chain = Promise.resolve();
    for (var p = 1; p <= doc.numPages; p++){
      (function(p){
        chain = chain.then(function(){
          return doc.getPage(p).then(function(page){
            return page.getTextContent().then(function(tc){
              /* Rebuild lines from item positions: pdf.js returns text in
                 reading order but with no line breaks, and the label-anchored
                 extractor needs lines to know which number belongs to which
                 label. Items within 2.5 pt vertically are the same line. */
              var rows = [];
              tc.items.forEach(function(it){
                var y = Math.round(it.transform[5] / 2.5);
                var r = rows[rows.length-1];
                if (!r || r.y !== y){ rows.push({ y:y, parts:[it.str] }); }
                else r.parts.push(it.str);
              });
              var text = rows.map(function(r){ return r.parts.join(' '); }).join('\n');
              var vp = page.getViewport({ scale:1 });
              /* 150 dpi equivalent is enough to read a bill on screen and
                 keeps a twelve-page set inside the storage quota. */
              var scale = Math.min(2.1, 1400 / Math.max(vp.width, vp.height));
              var v2 = page.getViewport({ scale:scale });
              var cv = document.createElement('canvas');
              cv.width = Math.round(v2.width); cv.height = Math.round(v2.height);
              return page.render({ canvasContext:cv.getContext('2d'), viewport:v2 }).promise
                .then(function(){
                  onPage({ src:file.name + ' p' + p,
                           img:{ dataUrl:cv.toDataURL('image/jpeg', 0.72), w:cv.width, h:cv.height },
                           text:text, textLayer: text.replace(/\s/g,'').length > 60 });
                });
            });
          });
        });
      })(p);
    }
    return chain;
  });
}
function readFileBuffer(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); };
    r.onerror = function(){ rej(new Error('Could not read ' + file.name)); };
    r.readAsArrayBuffer(file);
  });
}

function ingestBillImage(file, onPage){
  return ingestImage(file).then(function(a){
    onPage({ src:file.name, img:a, text:'', textLayer:false });
  });
}

/* A page becomes a bill row: existing rows are matched by month where the
   text gave one, so re-uploading a clearer scan of March updates March
   rather than adding a fourteenth month. */
function attachPage(page){
  var hits = extractBill(page.text);
  var row = null;
  if (hits.month){
    for (var i = 0; i < S.bills.length; i++){
      if (String(S.bills[i].month||'').toLowerCase() === String(hits.month.value).toLowerCase()){ row = S.bills[i]; break; }
    }
  }
  if (!row){
    /* Otherwise fill the first row that has no bill attached yet. */
    for (var j = 0; j < S.bills.length; j++) if (!S.bills[j].img){ row = S.bills[j]; break; }
  }
  if (!row){ row = { month:'' }; S.bills.push(row); }
  row.img = page.img;
  row.src = page.src;
  row.ocr = page.text || '';
  row.ocrSource = page.textLayer ? 'pdf' : (page.text ? 'ocr' : 'none');
  row.hits = {};
  Object.keys(hits).forEach(function(k){ row.hits[k] = hits[k]; });
  applyHits(row, false);
  row.verified = false;
  return row;
}
/* Only fills blanks unless told otherwise - a figure a human typed is not
   overwritten by a later machine reading of the same bill. */
function applyHits(row, overwrite){
  if (!row.hits) return 0;
  var n = 0;
  Object.keys(row.hits).forEach(function(k){
    var cur = row[k];
    var blank = (k === 'month') ? !cur : (num(cur) === null);
    if (blank || overwrite){ row[k] = row.hits[k].value; n++; }
  });
  return n;
}

function runOcrOn(row, statusFn){
  return ensureTesseract().then(function(T){
    statusFn('Reading the bill\u2026');
    return T.recognize(row.img.dataUrl, 'eng', {
      logger: function(m){
        if (m.status === 'recognizing text') statusFn('Reading \u2014 ' + Math.round(m.progress*100) + ' %');
      }
    });
  }).then(function(r){
    row.ocr = (r && r.data && r.data.text) || '';
    row.ocrSource = 'ocr';
    row.hits = extractBill(row.ocr);
    var n = applyHits(row, false);
    statusFn('');
    return n;
  });
}

/* ---- the workspace ------------------------------------------------ */
FORMS.verify = function(w){
  if (!S.bills.length){
    var e = card('No bills yet',
      'Upload them below, or create twelve empty months in the bill section and type the figures straight in.');
    e.appendChild(billUploader());
    w.appendChild(e);
    return;
  }
  if (S.billCursor === undefined || S.billCursor === null || S.billCursor >= S.bills.length) S.billCursor = 0;
  var idx = S.billCursor;
  var b = S.bills[idx];
  var prog = billsProgress();

  /* --- progress and navigation --- */
  var top = card('Bill ' + (idx+1) + ' of ' + prog.total +
    '  \u00B7  ' + prog.done + ' verified, ' + prog.left + ' to go',
    b.src ? ('From ' + b.src + (b.ocrSource === 'pdf' ? ' \u2014 read from the PDF text layer' :
             b.ocrSource === 'ocr' ? ' \u2014 read by OCR' : ' \u2014 no text found, type the figures')) :
            'No bill image attached to this month.');

  var barOuter = el('div','height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin:0 0 12px;');
  barOuter.appendChild(el('div','height:100%;width:' + (prog.total ? (prog.done/prog.total)*100 : 0) +
    '%;background:var(--ok);transition:width .2s;'));
  top.appendChild(barOuter);

  /* Every bill as a chip, so you can see at a glance what is left and jump
     straight to the awkward one rather than clicking Next eleven times. */
  var strip = el('div','display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;');
  S.bills.forEach(function(bb, i){
    var miss = billMissing(bb).length;
    var chip = el('button','', (bb.month || ('#' + (i+1))));
    chip.type = 'button';
    chip.className = 'btn sm';
    chip.style.cssText = 'border-color:' + (bb.verified ? 'var(--ok)' : (miss ? 'var(--bad)' : 'var(--rule)')) +
      ';' + (i === idx ? 'outline:2px solid var(--brand);outline-offset:1px;' : '') +
      (bb.verified ? 'color:var(--ok);' : '');
    chip.title = bb.verified ? 'Verified' : (miss ? miss + ' field(s) still empty' : 'Filled, not yet verified');
    chip.onclick = function(){ S.billCursor = i; save(); renderAll(); };
    strip.appendChild(chip);
  });
  top.appendChild(strip);

  var nav = el('div','display:flex;gap:6px;flex-wrap:wrap;align-items:center;');
  nav.appendChild(btn('\u2190 Previous', function(){
    S.billCursor = (idx - 1 + S.bills.length) % S.bills.length; save(); renderAll(); }));
  nav.appendChild(btn('Next \u2192', function(){
    S.billCursor = (idx + 1) % S.bills.length; save(); renderAll(); }));
  if (prog.left) nav.appendChild(btn('Jump to next unverified', function(){
    var n = nextUnverified(idx); if (n >= 0){ S.billCursor = n; save(); renderAll(); } }));
  top.appendChild(nav);
  w.appendChild(top);

  /* --- the two panes --- */
  var split = el('div');
  split.className = 'verifysplit';

  /* LEFT: the figures */
  var left = el('div','min-width:0;');
  var lc = card('Figures on this bill',
    'What the reader found is offered beside each field \u2014 click it to accept, or type over it. Nothing is counted until you press Verify.');

  BILL_FIELDS.forEach(function(f){
    var row = el('div','display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;');
    var fieldNode = f.type === 'text' ? fText(b, f.k, f.t) : fNum(b, f.k, f.t + (f.unit ? ', ' + f.unit : ''));
    fieldNode.style.flex = '1 1 auto';
    row.appendChild(fieldNode);

    var hit = b.hits && b.hits[f.k];
    var chipWrap = el('div','flex:0 0 auto;display:flex;flex-direction:column;gap:2px;align-items:flex-end;min-width:104px;');
    if (hit){
      var same = (f.type === 'text') ? String(b[f.k]||'') === String(hit.value)
                                     : num(b[f.k]) === num(hit.value);
      var chip = el('button','', (same ? '\u2713 ' : '') + hit.value);
      chip.type='button'; chip.className='btn sm';
      chip.style.cssText = 'font-family:var(--mono);' + (same ? 'color:var(--ok);border-color:var(--ok);' : 'color:var(--brand);');
      chip.title = 'Found on: "' + (hit.line||'').slice(0,90) + '"' + (hit.note ? '\n' + hit.note : '');
      chip.onclick = function(){ b[f.k] = hit.value; save(); renderAll(); };
      chipWrap.appendChild(chip);
      chipWrap.appendChild(el('div','font-size:10px;color:var(--ink-3);text-align:right;',
        same ? 'matches' : 'reader found'));

    }

  });

  /* live arithmetic, recomputed as you type because that is when a
     misreading is cheapest to notice */
  var checks = billChecks(b), missing = billMissing(b);
  var live = el('div','margin-top:10px;');
  var kwh = num(b.kwh), kvah = num(b.kvah);

  if (missing.length){
    var mm = el('p','', missing.length + ' field(s) still empty: ' +
      missing.map(function(k){ var f = null; BILL_FIELDS.forEach(function(x){ if (x.k===k) f=x; }); return f?f.t:k; }).join(', '));
    mm.className = 'callout warn';
    live.appendChild(mm);
  }
  checks.forEach(function(c){
    var p = el('p','', c.t); p.className = 'callout ' + (c.bad ? 'bad' : 'info');
    live.appendChild(p);
  });
  lc.appendChild(live);

  /* the single button the whole screen is built around */
  var vbar = el('div','display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;');
  var vb = el('button','', b.verified ? '\u2713 Verified \u2014 press to unverify' :
    (prog.left > 1 ? 'Verify this bill \u2192 next' : 'Verify this bill'));
  vb.type = 'button';
  vb.className = 'btn' + (b.verified ? ' sm' : ' primary');
  vb.onclick = function(){
    if (b.verified){ b.verified = false; save(); renderAll(); return; }
    var hard = billChecks(b).filter(function(c){ return c.bad; });
    if (hard.length && !confirm('This bill still fails ' + hard.length + ' arithmetic check:\n\n\u2022 ' +
        hard.map(function(c){ return c.t; }).join('\n\u2022 ') +
        '\n\nVerify it anyway?')) return;
    b.verified = true;
    b.verifiedAt = new Date().toISOString().slice(0,10);
    var n = nextUnverified(idx);
    if (n >= 0) S.billCursor = n;
    save(); renderAll();
  };
  vbar.appendChild(vb);
  if (b.hits && Object.keys(b.hits).length) vbar.appendChild(btn('Re-apply everything the reader found', function(){
    var n = applyHits(b, true); save(); renderAll();
    if (!n) alert('The reader found nothing on this bill.');
  }));
  lc.appendChild(vbar);
  left.appendChild(lc);

  /* searching the text is how you find the one number the extractor missed */
  if (b.ocr){
    var sc = card('Find it in the text',
      'Everything the reader pulled off this bill. Type a word \u2014 "demand", "kvah", "payable" \u2014 to see the lines it appears on.');
    var si = el('input'); si.type='search'; si.placeholder='demand';
    var res = el('div','font-family:var(--mono);font-size:11.5px;line-height:1.6;max-height:210px;overflow:auto;margin-top:8px;');
    var draw = function(){
      clear(res);
      var qtext = si.value.trim().toLowerCase();
      var lines = b.ocr.split(/\r?\n/).map(function(l){ return l.replace(/\s+/g,' ').trim(); }).filter(Boolean);
      var show = qtext ? lines.filter(function(l){ return l.toLowerCase().indexOf(qtext) >= 0; }) : lines;
      if (!show.length){ res.appendChild(el('div','color:var(--ink-3)','Nothing on this bill matches that.')); return; }
      show.slice(0, 200).forEach(function(l){
        res.appendChild(el('div','padding:1px 0;border-bottom:1px solid var(--rule);', l));
      });
      if (show.length > 200) res.appendChild(el('div','color:var(--ink-3)', '\u2026and ' + (show.length-200) + ' more lines.'));
    };
    si.addEventListener('input', draw);
    sc.appendChild(labelled('Search this bill', si));
    sc.appendChild(res);
    draw();
    left.appendChild(sc);
  }
  split.appendChild(left);

  /* RIGHT: the bill itself */
  var right = el('div','min-width:0;');
  var rc = card('The bill', b.img ? 'Drag to move it, scroll or use the slider to zoom.' :
    'No image for this month \u2014 upload one below and it attaches here.');
  if (b.img){
    var zoomWrap = el('div','display:flex;gap:10px;align-items:center;margin-bottom:8px;');
    var zr = el('input'); zr.type='range'; zr.min='0.4'; zr.max='4'; zr.step='0.05';
    zr.value = String(b.zoom || 1); zr.style.flex = '1';
    var view = el('div','position:relative;overflow:hidden;background:#f1f4f7;border:1px solid var(--rule);' +
      'border-radius:6px;height:min(74vh,860px);cursor:grab;');
    var im = el('img','position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;');
    im.src = b.img.dataUrl; im.alt = 'Electricity bill ' + (b.month || '');
    view.appendChild(im);

    var st = { z: b.zoom || null, x: b.panX || 0, y: b.panY || 0 };
    function fit(){
      var vw = view.clientWidth || 600;
      st.z = Math.min(vw / b.img.w, (view.clientHeight||700) / b.img.h);
      st.x = (vw - b.img.w * st.z) / 2; st.y = 0;
    }
    function paint(){
      im.style.width = b.img.w + 'px';
      im.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.z + ')';
      zr.value = String(st.z);
    }
    if (!st.z) fit();
    /* The image is inside a card that has not been laid out yet on first
       paint, so fit again once the browser knows how wide the pane is. */
    requestAnimationFrame(function(){ if (!b.zoom){ fit(); paint(); } else paint(); });
    if (window.ResizeObserver){
      new ResizeObserver(function(){ if (!b.zoom){ fit(); paint(); } }).observe(view);
    }

    zr.addEventListener('input', function(){
      var old = st.z, z = parseFloat(zr.value);
      /* zoom about the centre of the viewport, not the origin */
      var cx = view.clientWidth/2, cy = view.clientHeight/2;
      st.x = cx - (cx - st.x) * (z/old);
      st.y = cy - (cy - st.y) * (z/old);
      st.z = z; paint();
      b.zoom = st.z; b.panX = st.x; b.panY = st.y; save();
    });
    view.addEventListener('wheel', function(ev){
      ev.preventDefault();
      var old = st.z, z = Math.max(0.4, Math.min(4, st.z * (ev.deltaY < 0 ? 1.12 : 1/1.12)));
      var r = view.getBoundingClientRect();
      var cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      st.x = cx - (cx - st.x) * (z/old);
      st.y = cy - (cy - st.y) * (z/old);
      st.z = z; paint();
      b.zoom = st.z; b.panX = st.x; b.panY = st.y; save();
    }, { passive:false });
    var drag = null;
    view.addEventListener('pointerdown', function(ev){
      drag = { sx:ev.clientX, sy:ev.clientY, ox:st.x, oy:st.y };
      view.setPointerCapture(ev.pointerId); view.style.cursor='grabbing';
    });
    view.addEventListener('pointermove', function(ev){
      if (!drag) return;
      st.x = drag.ox + (ev.clientX - drag.sx);
      st.y = drag.oy + (ev.clientY - drag.sy);
      paint();
    });
    var endDrag = function(){
      if (!drag) return;
      drag = null; view.style.cursor='grab';
      b.zoom = st.z; b.panX = st.x; b.panY = st.y; save();
    };
    view.addEventListener('pointerup', endDrag);
    view.addEventListener('pointercancel', endDrag);

    zoomWrap.appendChild(el('span','font-size:12px;color:var(--ink-3);flex:0 0 auto;','Zoom'));
    zoomWrap.appendChild(zr);
    zoomWrap.appendChild(btn('Fit', function(){ fit(); paint(); b.zoom=st.z; b.panX=st.x; b.panY=st.y; save(); }));
    zoomWrap.appendChild(btn('100 %', function(){ st.z=1; paint(); b.zoom=1; save(); }));
    rc.appendChild(zoomWrap);
    rc.appendChild(view);

    var ob = el('div','display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;');
    var status = el('span','font-size:12px;color:var(--ink-3);align-self:center;');

                  : 'The reader ran but matched no labels. Type the figures from the image.'); })

          'published page may block. The figures can always be typed from the image on the right.'); });
    }));
    ob.appendChild(btn('Remove this image', function(){
      if (!confirm('Remove the bill image for ' + (b.month||'this month') + '? The figures stay.')) return;
      b.img = null; b.ocr=''; b.hits={}; b.ocrSource='none'; save(); renderAll();
    }));
    ob.appendChild(status);
    rc.appendChild(ob);
  }
  right.appendChild(rc);
  split.appendChild(right);
  w.appendChild(split);

  var up = card('Add more bills', 'PDFs, photographs, or both at once.');
  up.appendChild(billUploader());
  w.appendChild(up);

  if (prog.total && prog.done === prog.total){
    var okc = card('All ' + prog.total + ' bills verified',

        'This is worth doing once verification is finished \u2014 the images are the bulk of the saved draft.')) return;

};

function billUploader(){
  var wrap = el('div');
  var i = el('input'); i.type='file'; i.multiple = true;
  i.accept = '.pdf,image/*';
  var status = el('div','font-size:12px;color:var(--ink-3);margin-top:8px;min-height:18px;');
  i.addEventListener('change', function(){
    var files = [].slice.call(i.files || []);
    if (!files.length) return;
    i.value = '';
    var added = 0, problems = [];
    status.textContent = 'Reading ' + files.length + ' file(s)\u2026';
    var chain = Promise.resolve();
    files.forEach(function(f){
      chain = chain.then(function(){
        status.textContent = 'Reading ' + f.name + '\u2026';
        var isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
        var take = function(page){ attachPage(page); added++; };
        return (isPdf ? ingestBillPdf(f, take) : ingestBillImage(f, take))
          .catch(function(e){ problems.push(f.name + ': ' + e.message); });
      });
    });
    chain.then(function(){
      status.textContent = '';
      S.billCursor = 0;
      S.active = 'verify';
      save(); renderAll();
      var msg = added + ' bill page(s) added.';
      var noText = S.bills.filter(function(b){ return b.img && b.ocrSource === 'none'; }).length;
      if (noText) msg += '\n\n' + noText + ' of them are pictures with no text layer \u2014 use "Try OCR on this bill", ' +
        'or just read the figures off the image, which is faster than fighting a bad scan.';
      if (problems.length) msg += '\n\nCould not read:\n\u2022 ' + problems.join('\n\u2022 ') +
        '\n\nIf these are PDFs, the PDF reader could not be loaded here. Export the pages as images and upload those.';
      alert(msg);
    });
  });
  wrap.appendChild(labelled('Bill PDFs or photographs', i,
    'A twelve-page PDF becomes twelve bills. Each page is matched to a month when the text gives one, ' +
    'so a clearer re-scan updates that month instead of adding another.'));
  wrap.appendChild(status);
  return wrap;
}
