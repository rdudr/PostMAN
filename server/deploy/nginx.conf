# /etc/nginx/conf.d/eassiitgn.conf
# The subdomain serves the report tool as static files and the API from the
# same origin, so the browser has no cross-origin call to make at all.

server {
    listen 80;
    listen [::]:80;
    server_name eassiitgn.arenergyservices.in;
    # certbot writes its challenge here and rewrites the rest to 443.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eassiitgn.arenergyservices.in;

    ssl_certificate     /etc/letsencrypt/live/eassiitgn.arenergyservices.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eassiitgn.arenergyservices.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # A report is one big JSON document - photographs and bill scans included.
    client_max_body_size 64m;

    # The API.
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The report tool itself: index.html built from src/ by build.py.
    root /opt/eass/web;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        # The page is one file and changes on every deploy; never cache it.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
